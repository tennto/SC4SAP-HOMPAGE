<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설정 데모 모션 (라이트)</title>

<!-- 미리보기 페이지용 스타일. 랜딩페이지에 붙일 때는 필요 없습니다. -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         padding: 48px 24px; box-sizing: border-box; background: #ffffff; }
  .preview-wrap { width: 100%; max-width: 1120px; }
</style>


<!-- ================================================================
     여기부터 복사: (1) 폰트 링크  (2) <style>  (3) .stx 마크업  (4) <script>
     ================================================================ -->

<!-- (1) Pretendard. 이미 사이트에서 쓰고 있다면 이 줄은 빼도 됩니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- (2) 스타일. 모든 클래스가 stx- 로 시작해서 다른 데모(sapd-, spx-, mcx-)와 충돌하지 않습니다. -->
<style>
.stx {
  /* 다크 테마 (기본) */
  --bg: #111317;
  --card: #171a1f;
  --line: #2b2f36;
  --line-strong: #383b40;
  --field-line: #4a4f58;
  --ink: #e6e9ee;
  --ink-2: #bdbfc4;
  --muted: #888c91;
  --dim: #6f737a;
  --track: #2a2e35;
  --hover: #22262d;
  --btn: #e6e9ee;
  --btn-ink: #111317;
  --btn-off: #2f333a;
  --btn-off-ink: #6f737a;
  --ring: rgba(230, 233, 238, .1);
  --backdrop: rgba(5, 6, 8, .6);
  --edge: rgba(255, 255, 255, .06);
  --frame: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 80px -24px rgba(0, 0, 0, .7);
  --pop: 0 16px 36px -10px rgba(0, 0, 0, .65);
  --cursor-fill: #ffffff;
  --cursor-line: #111317;
  --cursor-shadow: rgba(0, 0, 0, .5);

  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --ease: cubic-bezier(.22, .8, .24, 1);

  position: relative;
  width: 100%;
  aspect-ratio: 1200 / 660;
  overflow: hidden;
  border-radius: 14px;
  background: var(--bg);
  box-shadow: var(--frame);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  pointer-events: none;
  visibility: hidden;
}
/* 라이트 테마: <div class="stx" data-theme="light"> */
.stx[data-theme="light"] {
  --bg: #f4f5f7;
  --card: #ffffff;
  --line: #e4e5e8;
  --line-strong: #d5d7d9;
  --field-line: #9da1a8;
  --ink: #2f3540;
  --ink-2: #4a4f59;
  --muted: #6d7179;
  --dim: #a0a3a9;
  --track: #e7eaee;
  --hover: #f0f1f5;
  --btn: #2f3540;
  --btn-ink: #ffffff;
  --btn-off: #b9bcc2;
  --btn-off-ink: #ffffff;
  --ring: rgba(47, 53, 64, .1);
  --backdrop: rgba(47, 53, 64, .38);
  --edge: rgba(47, 53, 64, .06);
  --frame: 0 0 0 1px rgba(47, 53, 64, .1), 0 30px 70px -30px rgba(47, 53, 64, .28);
  --pop: 0 16px 36px -14px rgba(47, 53, 64, .35);
  --cursor-fill: #2f3540;
  --cursor-line: #ffffff;
  --cursor-shadow: rgba(47, 53, 64, .3);
}
.stx.is-ready { visibility: visible; }
.stx.is-compact { aspect-ratio: 480 / 720; }
.stx *, .stx *::before, .stx *::after { box-sizing: border-box; }

.stx-stage {
  position: absolute; top: 0; left: 0;
  width: 1200px; height: 660px;
  transform-origin: 0 0;
  transform: scale(var(--s, 1));
  font-size: 13px; line-height: 1.5;
  transition: opacity .45s;
}
.stx.is-compact .stx-stage { width: 480px; height: 720px; }
.stx.is-fading .stx-stage { opacity: 0; }
.stx-sprite { position: absolute; width: 0; height: 0; }
.stx-i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor;
         stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 페이지 ---------- */
.stx-page { position: absolute; top: 0; left: 0; width: 100%; padding: 26px 0 64px;
            transition: transform 1.1s var(--ease); }
.stx-col { width: 780px; margin: 0 auto; }
.stx.is-compact .stx-col { width: auto; margin: 0 16px; }
.stx-title { margin: 0 0 16px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }

.stx-card { padding: 22px 24px 8px; border-radius: 14px; background: var(--card);
            box-shadow: 0 0 0 1px var(--edge), 0 1px 2px rgba(0, 0, 0, .04); }
.stx-card + .stx-card { margin-top: 16px; }
.stx.is-compact .stx-card { padding: 16px 16px 4px; }
.stx-head { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.stx-head > .stx-i { color: var(--muted); }
.stx-act { margin: -6px -6px -6px auto; width: 30px; height: 30px; display: grid; place-items: center;
           border-radius: 8px; color: var(--muted); transition: background .2s, transform .14s; }
.stx-act.is-hover { background: var(--hover); color: var(--ink); }
.stx-act.is-press { transform: scale(.9); }
.stx-sub { margin: 5px 0 22px; font-size: 11.5px; color: var(--muted); }

.stx-l { font-size: 11px; font-weight: 700; letter-spacing: .03em; color: var(--ink-2); }
.stx-row { padding: 15px 0 16px; border-top: 1px solid var(--line); }
.stx-v { position: relative; display: inline-block; margin-top: 3px; font-size: 14.5px; transition: color .25s; }
.stx-v.is-load { color: transparent; }
.stx-v.is-load::after { content: ""; position: absolute; left: 0; top: 5px; width: 150px; height: 12px;
                        border-radius: 4px; background: var(--track); animation: stx-pulse .9s ease-in-out infinite; }
.stx-v.is-bump { animation: stx-bump .6s var(--ease); }
.stx-hint { margin: 5px 0 0; font-size: 11px; line-height: 1.6; color: var(--dim); min-height: 17px; }
.stx-block { padding-bottom: 18px; }

/* ---------- 셀렉트와 메뉴 ---------- */
.stx-dd { position: relative; margin-top: 8px; }
.stx-sel {
  height: 42px; padding: 0 14px; display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--field-line); border-radius: 9px; font-size: 14.5px; white-space: nowrap;
  transition: border-color .2s, box-shadow .2s;
}
.stx-sel > span { overflow: hidden; text-overflow: ellipsis; }
.stx-sel .stx-i { margin-left: auto; color: var(--muted); transition: transform .25s var(--ease); }
.stx-sel.is-open { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ring); }
.stx-sel.is-open .stx-i { transform: rotate(180deg); }
.stx-w-sys { width: 470px; }
.stx-w-app { width: 290px; }
.stx.is-compact .stx-w-sys, .stx.is-compact .stx-w-app { width: auto; }
.stx-input { justify-content: flex-start; gap: 0; }
.stx-input i { display: none; width: 1.5px; height: 17px; margin-left: 1px; background: var(--ink);
               animation: stx-blink 1s steps(1) infinite; }
.stx-input.is-open i { display: block; }
.stx-ph { color: var(--dim); }
.stx-input.has-text .stx-ph { display: none; }

.stx-menu {
  position: absolute; left: 0; top: 48px; z-index: 4; padding: 6px;
  border: 1px solid var(--line-strong); border-radius: 11px; background: var(--card);
  box-shadow: var(--pop);
  opacity: 0; transform: translateY(-5px); transition: opacity .2s, transform .25s var(--ease);
}
.stx-menu.is-open { opacity: 1; transform: none; }
.stx-menu div { height: 36px; padding: 0 11px; display: flex; align-items: center; gap: 12px;
                border-radius: 7px; font-size: 13.5px; white-space: nowrap; color: var(--ink-2);
                transition: background .15s; }
.stx-menu div.is-cur { font-weight: 700; color: var(--ink); }
.stx-menu div .stx-i { margin-left: auto; opacity: 0; color: var(--muted); }
.stx-menu div.is-cur .stx-i { opacity: 1; }
.stx-menu div.is-hover { background: var(--hover); }
.stx-menu.is-scroll { max-height: 230px; overflow: hidden; padding-right: 16px; }
.stx-menu.is-scroll::after { content: ""; position: absolute; right: 5px; top: 8px; width: 5px; height: 74px;
                             border-radius: 3px; background: var(--line-strong); }

/* ---------- 범위 수정 모달 ---------- */
.stx-backdrop { position: absolute; inset: 0; z-index: 6; background: var(--backdrop);
                opacity: 0; transition: opacity .3s; }
.stx-modal {
  position: absolute; left: 50%; top: 50%; z-index: 7; width: 520px; padding: 24px 26px 22px;
  border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--edge), var(--pop);
  opacity: 0; transform: translate(-50%, -48%) scale(.97);
  transition: opacity .3s, transform .4s var(--ease);
}
.stx.is-compact .stx-modal { width: 448px; padding: 20px 18px 18px; }
.stx.is-modal .stx-backdrop { opacity: 1; }
.stx.is-modal .stx-modal { opacity: 1; transform: translate(-50%, -50%); }
.stx-chip { display: inline-block; padding: 4px 11px; border-radius: 999px; background: var(--btn); color: var(--btn-ink);
            font-size: 10.5px; font-weight: 700; }
.stx-modal h4 { margin: 14px 0 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.stx-modal p { margin: 8px 0 20px; font-size: 13px; color: var(--muted); }
.stx-modal .stx-dd { margin-bottom: 16px; }
.stx-modal .stx-menu { right: 0; }
.stx-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.stx-btn { height: 34px; padding: 0 16px; display: flex; align-items: center; border-radius: 9px;
           font-size: 12.5px; font-weight: 700; transition: background .25s, color .25s, transform .14s; }
.stx-cancel { border: 1px solid var(--line-strong); color: var(--ink-2); }
.stx-save { background: var(--btn-off); color: var(--btn-off-ink); }
.stx.is-dirty .stx-save { background: var(--btn); color: var(--btn-ink); }
.stx-save.is-press { transform: scale(.94); }

/* ---------- 마우스 커서 ---------- */
.stx-cursor { position: absolute; top: 0; left: 0; z-index: 9; width: 20px; height: 20px;
              opacity: 0; transition: transform .75s var(--ease), opacity .3s; }
.stx-cursor.is-on { opacity: 1; }
.stx.is-compact .stx-cursor { display: none; }
.stx-cursor svg { display: block; width: 20px; height: 20px; filter: drop-shadow(0 2px 3px var(--cursor-shadow)); }
.stx-cursor path { fill: var(--cursor-fill); stroke: var(--cursor-line); }
.stx-cursor::after { content: ""; position: absolute; left: -9px; top: -10px; width: 24px; height: 24px;
                     border-radius: 50%; border: 1.5px solid var(--ink); opacity: 0; }
.stx-cursor.is-click::after { animation: stx-click .45s ease-out; }

.stx.is-resetting, .stx.is-resetting * { transition: none !important; animation: none !important; }

@keyframes stx-blink { 50% { opacity: 0; } }
@keyframes stx-pulse { 50% { opacity: .45; } }
@keyframes stx-bump { 0% { transform: translateY(-6px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes stx-click { 0% { opacity: .7; transform: scale(.3); } 100% { opacity: 0; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .stx, .stx * { transition: none !important; animation: none !important; }
}
</style>
</head>

<body>
<div class="preview-wrap">

<!-- (3) 마크업. 데모가 들어갈 자리에 넣으세요. 부모 너비에 맞춰 자동으로 축소됩니다.
     다크로 쓰려면 data-theme="light" 속성을 지우면 됩니다. -->
<div class="stx" data-theme="light" data-stx-settings role="img"
     aria-label="설정 데모: 연결할 SAP 시스템을 클릭 한 번으로 전환하고, 산업과 차단 목록 프로필과 허용 테이블을 정하고, 세션에서 무엇을 승인받을지 고릅니다.">
  <div class="stx-stage" aria-hidden="true">

    <svg class="stx-sprite">
      <symbol id="stx-db" viewBox="0 0 16 16"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v4c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8v4c0 1.1 2.2 2 5 2s5-.9 5-2V8"/></symbol>
      <symbol id="stx-shield" viewBox="0 0 16 16"><path d="M8 1.8 13 3.6v4.1c0 3-2 5.300-5 6.500-3-1.200-5-3.500-5-6.500V3.600L8 1.800Z"/><path d="m5.800 8 1.600 1.600 2.900-3.100"/></symbol>
      <symbol id="stx-sliders" viewBox="0 0 16 16"><path d="M4 2v3.500M4 9v5M8 2v6.500M8 12v2M12 2v1.500M12 7v7"/><circle cx="4" cy="7.200" r="1.600"/><circle cx="8" cy="10.200" r="1.600"/><circle cx="12" cy="5.200" r="1.600"/></symbol>
      <symbol id="stx-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
      <symbol id="stx-pencil" viewBox="0 0 16 16"><path d="M10.600 2.800 13.200 5.400 5.600 13H3v-2.600l7.600-7.600ZM9.200 4.200l2.600 2.600"/></symbol>
      <symbol id="stx-chev" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></symbol>
      <symbol id="stx-check" viewBox="0 0 16 16"><path d="m3.500 8.300 3 3 6-6.600"/></symbol>
    </svg>

    <div class="stx-page">
      <div class="stx-col">
        <h3 class="stx-title" data-t="title"></h3>

        <div class="stx-card" data-card="sys">
          <div class="stx-head"><svg class="stx-i"><use href="#stx-db"/></svg><span data-t="sysHead"></span>
            <span class="stx-act"><svg class="stx-i"><use href="#stx-plus"/></svg></span></div>
          <p class="stx-sub" data-t="sysSub"></p>
          <div class="stx-block">
            <div class="stx-l" data-t="active"></div>
            <div class="stx-dd stx-w-sys">
              <div class="stx-sel" data-sel="sys"><span></span><svg class="stx-i"><use href="#stx-chev"/></svg></div>
              <div class="stx-menu" data-menu="sys" style="right:0"></div>
            </div>
            <p class="stx-hint" data-t="sysHint"></p>
          </div>
          <div class="stx-row"><div class="stx-l">ADT URL</div><span class="stx-v" data-sys="url"></span></div>
          <div class="stx-row"><div class="stx-l" data-t="client"></div><span class="stx-v" data-sys="client"></span></div>
          <div class="stx-row"><div class="stx-l" data-t="user"></div><span class="stx-v" data-sys="user"></span></div>
          <div class="stx-row"><div class="stx-l" data-t="release"></div><span class="stx-v" data-sys="release"></span></div>
        </div>

        <div class="stx-card" data-card="scope">
          <div class="stx-head"><svg class="stx-i"><use href="#stx-shield"/></svg><span data-t="scope"></span>
            <span class="stx-act" data-act="edit"><svg class="stx-i"><use href="#stx-pencil"/></svg></span></div>
          <p class="stx-sub" data-t="scopeSub"></p>
          <div class="stx-row"><div class="stx-l" data-t="industry"></div><span class="stx-v" data-scope="industry"></span>
            <p class="stx-hint" data-t="industryHint"></p></div>
          <div class="stx-row"><div class="stx-l" data-t="profile"></div><span class="stx-v" data-scope="profile"></span>
            <p class="stx-hint" data-scope="profileHint"></p></div>
          <div class="stx-row"><div class="stx-l" data-t="allow"></div><span class="stx-v" data-scope="allow"></span>
            <p class="stx-hint" data-t="allowHint"></p></div>
        </div>

        <div class="stx-card" data-card="session">
          <div class="stx-head"><svg class="stx-i"><use href="#stx-sliders"/></svg><span data-t="session"></span></div>
          <p class="stx-sub" data-t="sessionSub"></p>
          <div class="stx-block">
            <div class="stx-l" data-t="approval"></div>
            <div class="stx-dd stx-w-app">
              <div class="stx-sel" data-sel="app"><span></span><svg class="stx-i"><use href="#stx-chev"/></svg></div>
              <div class="stx-menu" data-menu="app" style="right:0"></div>
            </div>
            <p class="stx-hint" data-app-hint></p>
          </div>
          <div class="stx-row"><div class="stx-l" data-t="model"></div><span class="stx-v">Sonnet</span>
            <p class="stx-hint" data-t="modelHint"></p></div>
        </div>
      </div>
    </div>

    <div class="stx-backdrop"></div>
    <div class="stx-modal">
      <span class="stx-chip" data-t="scope"></span>
      <h4 data-t="editTitle"></h4>
      <p data-t="editSub"></p>
      <div class="stx-l" data-t="industry"></div>
      <div class="stx-dd">
        <div class="stx-sel" data-sel="ind"><span></span><svg class="stx-i"><use href="#stx-chev"/></svg></div>
        <div class="stx-menu is-scroll" data-menu="ind"></div>
      </div>
      <div class="stx-l" data-t="profile"></div>
      <div class="stx-dd">
        <div class="stx-sel" data-sel="pro"><span></span><svg class="stx-i"><use href="#stx-chev"/></svg></div>
        <div class="stx-menu" data-menu="pro"></div>
      </div>
      <div class="stx-l" data-t="allow"></div>
      <div class="stx-dd" style="margin-bottom:0">
        <div class="stx-sel stx-input" data-sel="allow"><span class="stx-typed"></span><i></i><span class="stx-ph" data-t="placeholder"></span></div>
      </div>
      <div class="stx-actions">
        <span class="stx-btn stx-cancel" data-t="cancel"></span>
        <span class="stx-btn stx-save" data-t="save"></span>
      </div>
    </div>

    <div class="stx-cursor"><svg viewBox="0 0 20 20"><path d="M3 2l13.2 6.4-5.7 1.7-1.9 5.7L3 2z" stroke-width="1" stroke-linejoin="round"/></svg></div>
  </div>
</div>

</div>

<!-- (4) 스크립트. </body> 바로 앞에 넣으세요. 의존성 없고, 페이지 안의 모든 data-stx-settings 요소에 적용됩니다. -->
<script>
(function () {
  /* 언어: 사이트가 window.__reelLang 으로 넘겨주고, 단독으로 열면 <html lang>을 따릅니다 (기본 한국어) */
  var LANG = (function () { var l = String(window.__reelLang || document.documentElement.getAttribute('lang') || 'ko').toLowerCase(); return l.indexOf('ja') === 0 ? 'ja' : l.indexOf('en') === 0 ? 'en' : 'ko'; })();
  document.documentElement.lang = LANG;

  /* ---------- 화면 문구 (언어별) ---------- */
  var TEXT = {
    ko: {
      aria: '설정 데모: 연결할 SAP 시스템을 클릭 한 번으로 전환하고, 산업과 차단 목록 프로필과 허용 테이블을 정하고, 세션에서 무엇을 승인받을지 고릅니다.',
      title: '설정', sysHead: 'SAP 시스템',
      sysSub: '모든 세션이 연결되는 시스템입니다. 이 계정이 아니라 백엔드 전체에 적용됩니다.',
      active: '활성 시스템',
      sysHint: '전환하면 다른 사람의 것까지 열려 있는 모든 세션이 닫힙니다. 다음에 여는 세션부터 새 시스템에서 시작합니다.',
      client: '클라이언트', user: '사용자', release: '릴리스',
      scope: '범위',
      scopeSub: '이 계정에 저장됩니다. 백엔드는 아직 모든 세션에 하나의 프로필을 쓰므로, 계정별 세션이 도입되면 적용됩니다.',
      industry: '산업', industryHint: '컨설턴트 에이전트가 답하기 전에 읽을 참고 자료를 정합니다.',
      profile: '차단 목록 프로필', allow: '허용 테이블',
      allowHint: '차단 목록과 무관하게 통과시킵니다. 읽을 때마다 감사 기록은 남습니다.',
      session: '세션', sessionSub: '세션이 어떻게 실행되고, 먼저 무엇을 묻는지입니다.',
      approval: '승인', model: '기본 모델',
      modelHint: '채팅이 시작할 때 쓰는 모델입니다. 리뷰어를 파견하는 스킬은 실행 전에 어떤 모델을 쓸지 묻습니다.',
      editTitle: '범위 수정', editSub: '여기 값은 SAP 시스템에 확인하지 않습니다. 저장하면 선택이 기록됩니다.',
      placeholder: '쉼표로 구분해 입력', cancel: '취소', save: '저장',
      industries: ['특정 산업 아님', '자동차', '은행', '화학', '건설 / E&C', '화장품', '전자 / 하이테크'],
      profileHints: ['', '플러그인 기본값. HR, 급여, 재무 라인 아이템 테이블을 추가합니다.', '가장 엄격한 프로필입니다. 차단하는 테이블 범위가 가장 넓습니다.'],
      allowNone: '없음',
      approvals: [
        { label: '쓰기만 묻기', hint: 'SAP 읽기, 에이전트 자체 읽기, 읽기 전용 셸 명령은 통과합니다. 파일을 바꾸거나, 테이블 행을 가져오거나, 머신 밖으로 나가는 것은 묻습니다.' },
        { label: '모두 묻기', hint: '읽기를 포함해 에이전트가 하는 모든 동작을 실행 전에 묻습니다.' },
        { label: '묻지 않기', hint: '' }
      ]
    },
    en: {
      aria: 'Settings demo: switch the connected SAP system in one click, set the industry, blocklist profile and allowed tables, then choose what a session asks approval for.',
      title: 'Settings', sysHead: 'SAP system',
      sysSub: 'The system every session connects to. Applies to the whole backend, not just this account.',
      active: 'Active system',
      sysHint: 'Switching closes every open session, including other people\u2019s. Sessions opened after that start on the new system.',
      client: 'Client', user: 'User', release: 'Release',
      scope: 'Scope',
      scopeSub: 'Saved to this account. The backend still runs every session on one profile, so this applies once per-account sessions arrive.',
      industry: 'Industry', industryHint: 'Sets the reference material the consultant agents read before answering.',
      profile: 'Blocklist profile', allow: 'Allowed tables',
      allowHint: 'Passed regardless of the blocklist. Every read still leaves an audit record.',
      session: 'Session', sessionSub: 'How sessions run, and what they ask first.',
      approval: 'Approval', model: 'Default model',
      modelHint: 'The model a chat starts with. Skills that dispatch reviewers ask which model to use before running.',
      editTitle: 'Edit scope', editSub: 'These values are not checked against the SAP system. Saving records your choice.',
      placeholder: 'Comma-separated', cancel: 'Cancel', save: 'Save',
      industries: ['No specific industry', 'Automotive', 'Banking', 'Chemicals', 'Construction / E&C', 'Cosmetics', 'Electronics / High-tech'],
      profileHints: ['', 'Plugin default. Adds HR, payroll and finance line-item tables.', 'The strictest profile, blocking the widest range of tables.'],
      allowNone: 'None',
      approvals: [
        { label: 'Ask before writes', hint: 'SAP reads, the agent\u2019s own reads and read-only shell commands pass. Changing files, fetching table rows or anything leaving the machine asks first.' },
        { label: 'Ask for everything', hint: 'Asks before every action the agent takes, reads included.' },
        { label: 'Never ask', hint: '' }

    },
    ja: {
      aria: '設定デモ：接続先の SAP システムをワンクリックで切り替え、業種・ブロックリストプロファイル・許可テーブルを決め、セッションで何の承認を求めるかを選びます。',
      title: '設定', sysHead: 'SAP システム',
      sysSub: 'すべてのセッションが接続するシステムです。このアカウントだけでなくバックエンド全体に適用されます。',
      active: '有効なシステム',
      sysHint: '切り替えると、他のユーザーのものも含め開いているセッションはすべて閉じます。次に開くセッションから新しいシステムで始まります。',
      client: 'クライアント', user: 'ユーザー', release: 'リリース',
      scope: 'スコープ',
      scopeSub: 'このアカウントに保存されます。バックエンドはまだ全セッションで一つのプロファイルを使うため、アカウント別セッションの導入後に適用されます。',
      industry: '業種', industryHint: 'コンサルタントエージェントが回答前に読む参考資料を決めます。',
      profile: 'ブロックリストプロファイル', allow: '許可テーブル',
      allowHint: 'ブロックリストに関係なく通します。読み取るたびに監査記録は残ります。',
      session: 'セッション', sessionSub: 'セッションの実行方法と、最初に何を確認するかです。',
      approval: '承認', model: '既定のモデル',
      modelHint: 'チャット開始時に使うモデルです。レビュアーを派遣するスキルは、実行前にどのモデルを使うか確認します。',
      editTitle: 'スコープを編集', editSub: 'ここの値は SAP システムに照合しません。保存すると選択が記録されます。',
      placeholder: 'カンマ区切りで入力', cancel: 'キャンセル', save: '保存',
      industries: ['特定の業種なし', '自動車', '銀行', '化学', '建設 / E&C', '化粧品', '電子 / ハイテク'],
      profileHints: ['', 'プラグインの既定値。HR・給与・財務明細テーブルを追加します。', '最も厳格なプロファイルです。ブロックするテーブルの範囲が最も広くなります。'],
      allowNone: 'なし',
      approvals: [
        { label: '書き込みのみ確認', hint: 'SAP の読み取り、エージェント自身の読み取り、読み取り専用のシェルコマンドは通します。ファイルの変更、テーブル行の取得、マシン外への送信は確認します。' },
        { label: 'すべて確認', hint: '読み取りを含め、エージェントのすべての操作を実行前に確認します。' },
        { label: '確認しない', hint: '' }
      ]
    }
  };
  var L = TEXT[LANG];

  /* ---------- 여기만 고치면 값과 선택지가 바뀝니다 ---------- */
  var CONFIG = {
    // SAP 시스템 목록. from에서 시작해 to로 전환합니다.
    systems: [
      { label: 'KR-DEV · Korea Development — S/4HANA 758', url: 'http://dev.example.com:50000', client: '100 · DEV', user: 'SV5_000030', release: '758' },
      { label: 'KR-DEV2 · Korea Development 2 — crown, S/4HANA 758', url: 'http://crown.example.com:50000', client: '100 · DEV', user: 'SV5_000030', release: '758' }
    ],
    systemFrom: 0, systemTo: 1,

    // 범위: 산업 (목록 앞부분만 보여줍니다)
    industries: L.industries,
    industryFrom: 0, industryTo: 1,

    // 범위: 차단 목록 프로필과 프로필별 설명
    profiles: [
      { label: 'Minimal', hint: L.profileHints[0] },
      { label: 'Standard', hint: L.profileHints[1] },
      { label: 'Strict', hint: L.profileHints[2] }
    ],
    profileFrom: 1, profileTo: 2,

    // 범위: 허용 테이블
    allowFrom: L.allowNone, allowTo: 'BKPF, BSEG',

    // 세션: 승인 방식과 방식별 설명
    approvals: L.approvals,
    approvalFrom: 0, approvalTo: 1,

    holdMs: 1500                              // 마지막 화면 유지 시간
  };
  /* --------------------------------------------------------- */

  /* ---------- 재생 중 언어 전환 ----------
     window.__reelSetLang('en') 처럼 부르면 처음으로 돌아가지 않고 그 자리에서 문구만 바뀝니다.
     앞으로 쓸 문구(L, CONFIG)를 새 언어로 바꾸고, 이미 화면에 있는 글자는 다른 언어의 같은 문구를
     찾아 새 언어로 맞바꿉니다. 상태 클래스, 위치, 타이머는 건드리지 않습니다. */
  var ROOTS = [];
  // 같은 구조의 두 값에서 문자열끼리 짝을 지어 map[다른 언어 문구] = 새 언어 문구
  function pairUp(from, to, map) {
    if (typeof from === 'string') { if (from && typeof to === 'string' && from !== to) map[from] = to; return; }
    if (from && typeof from === 'object') for (var k in from) if (to && k in to) pairUp(from[k], to[k], map);
  }
  function swapMap(lang) {
    var map = {};
    for (var l in TEXT) if (l !== lang) pairUp(TEXT[l], TEXT[lang], map);
    return map;
  }
  function tr(s, map) { var k = String(s).trim(); return map[k] !== undefined ? String(s).replace(k, map[k]) : s; }
  function swapText(el, map) {
    var walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), n;
    while ((n = walk.nextNode())) { var v = tr(n.nodeValue, map); if (v !== n.nodeValue) n.nodeValue = v; }
    [].forEach.call(el.querySelectorAll('[placeholder], [title], [aria-label]'), function (x) {
      ['placeholder', 'title', 'aria-label'].forEach(function (a) {
        if (x.hasAttribute(a)) { var v = tr(x.getAttribute(a), map); if (v !== x.getAttribute(a)) x.setAttribute(a, v); }
      });
    });
  }
  var SWAP = {};   // 재생 중에 이미 넘겨받은 옛 언어 목록을 setSelect 에서 고칠 때 씁니다
  window.__reelSetLang = function (lang) {
    lang = String(lang || '').toLowerCase();
    lang = lang.indexOf('ja') === 0 ? 'ja' : lang.indexOf('en') === 0 ? 'en' : 'ko';
    if (lang === LANG) return;
    LANG = lang; L = TEXT[lang]; SWAP = swapMap(lang);
    document.documentElement.lang = lang;
    CONFIG.industries = L.industries;
    CONFIG.profiles.forEach(function (p, i) { p.hint = L.profileHints[i]; });
    if (CONFIG.allowFrom === '' || SWAP[CONFIG.allowFrom] !== undefined) CONFIG.allowFrom = L.allowNone;
    CONFIG.approvals = L.approvals;
    ROOTS.forEach(function (root) {
      root.setAttribute('aria-label', L.aria);
      [].forEach.call(root.querySelectorAll('[data-t]'), function (el) { el.textContent = L[el.getAttribute('data-t')]; });
      swapText(root, SWAP);
    });
  };

  var CANCEL = {};
  var CHECK = '<svg class="stx-i"><use href="#stx-check"/></svg>';

  function init(root) {
    var $ = function (s) { return root.querySelector(s); };
    var all = function (s) { return [].slice.call(root.querySelectorAll(s)); };
    var stage = $('.stx-stage'), page = $('.stx-page'), cursor = $('.stx-cursor'),
        editBtn = $('[data-act="edit"]'), save = $('.stx-save'),
        allowIn = $('[data-sel="allow"]'), typed = $('.stx-typed'), appHint = $('[data-app-hint]');
    var sel = {}, menu = {}, sys = {}, scope = {};
    all('[data-sel]').forEach(function (el) { sel[el.getAttribute('data-sel')] = el; });
    all('[data-menu]').forEach(function (el) { menu[el.getAttribute('data-menu')] = el; });
    all('[data-sys]').forEach(function (el) { sys[el.getAttribute('data-sys')] = el; });
    all('[data-scope]').forEach(function (el) { scope[el.getAttribute('data-scope')] = el; });
    var scale = 1, token = 0, running = false, compact = null;
    all('[data-t]').forEach(function (el) { el.textContent = L[el.getAttribute('data-t')]; });
    root.setAttribute('aria-label', L.aria);
    ROOTS.push(root);

    function sleep(ms, t) {
      return new Promise(function (res, rej) {
        setTimeout(function () { t === token ? res() : rej(CANCEL); }, ms);
      });
    }
    function fit() {
      var w = root.clientWidth;
      if (!w) return;
      var c = w < 640;
      root.classList.toggle('is-compact', c);
      scale = w / (c ? 480 : 1200);
      root.style.setProperty('--s', scale);
      root.classList.add('is-ready');
      if (compact !== null && compact !== c && running) { compact = c; stop(); start(); }
      compact = c;
    }

    function topIn(el, box) { return (el.getBoundingClientRect().top - box.getBoundingClientRect().top) / scale; }
    function scrollPage(el, gap) {
      var max = Math.max(0, page.offsetHeight - (compact ? 720 : 660));
      var y = Math.min(max, Math.max(0, topIn(el, page) - gap));
      page.style.transform = 'translateY(' + -y + 'px)';
    }
    function point(el, fx, fy) {
      var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
      return [(r.left - s.left + r.width * fx) / scale, (r.top - s.top + r.height * fy) / scale];
    }
    function moveTo(p) { cursor.style.transform = 'translate(' + (p[0] - 3) + 'px,' + (p[1] - 2) + 'px)'; }
    function click() { cursor.classList.remove('is-click'); void cursor.offsetWidth; cursor.classList.add('is-click'); }
    async function clickOn(el, fx, fy, t) { moveTo(point(el, fx, fy)); await sleep(690, t); click(); }
    function bump(el) { el.classList.remove('is-bump'); void el.offsetWidth; el.classList.add('is-bump'); }

    /* 셀렉트 값과 메뉴 채우기 */
    /* labels 는 언어 전환 전에 넘겨받았을 수 있어서, 쓰기 직전에 지금 언어로 맞춥니다 */
    function setSelect(name, labels, cur) {
      labels = labels.map(function (l) { return tr(l, SWAP); });
      sel[name].firstElementChild.textContent = labels[cur];
      menu[name].innerHTML = labels.map(function (l, i) {
        return '<div' + (i === cur ? ' class="is-cur"' : '') + '>' + l.replace(/&/g, '&amp;') + CHECK + '</div>';
      }).join('');
    }
    /* 셀렉트를 열고 idx번째 항목을 고르는 동작 */
    async function pick(name, labels, idx, t) {
      await clickOn(sel[name], .88, .55, t);
      sel[name].classList.add('is-open'); menu[name].classList.add('is-open');
      await sleep(440, t);
      var opt = menu[name].children[idx];
      moveTo(point(opt, .28, .55));
      await sleep(540, t);
      opt.classList.add('is-hover');
      await sleep(240, t);
      click();
      sel[name].classList.remove('is-open'); menu[name].classList.remove('is-open');
      await sleep(120, t);
      setSelect(name, labels, idx);
    }
    function labels(list) { return list.map(function (x) { return x.label || x; }); }

    function showSystem(i) {
      var s = CONFIG.systems[i];
      sys.url.textContent = s.url; sys.client.textContent = s.client;
      sys.user.textContent = s.user; sys.release.textContent = s.release;
    }
    function showScope(ind, pro, allow) {
      scope.industry.textContent = CONFIG.industries[ind];
      scope.profile.textContent = CONFIG.profiles[pro].label;
      scope.profileHint.textContent = CONFIG.profiles[pro].hint;
      scope.allow.textContent = allow;
    }
    function fillModal(ind, pro) {
      setSelect('ind', CONFIG.industries, ind);
      setSelect('pro', labels(CONFIG.profiles), pro);
      typed.textContent = ''; allowIn.classList.remove('has-text', 'is-open');
    }

    function reset() {
      root.classList.add('is-resetting');
      root.classList.remove('is-modal', 'is-dirty', 'is-fading');
      setSelect('sys', labels(CONFIG.systems), CONFIG.systemFrom); showSystem(CONFIG.systemFrom);
      showScope(CONFIG.industryFrom, CONFIG.profileFrom, CONFIG.allowFrom);
      fillModal(CONFIG.industryFrom, CONFIG.profileFrom);
      setSelect('app', labels(CONFIG.approvals), CONFIG.approvalFrom);
      appHint.textContent = CONFIG.approvals[CONFIG.approvalFrom].hint;
      all('.stx-v').forEach(function (v) { v.classList.remove('is-load', 'is-bump'); });
      all('.stx-sel, .stx-menu').forEach(function (e) { e.classList.remove('is-open'); });
      editBtn.classList.remove('is-hover', 'is-press'); save.classList.remove('is-press');
      page.style.transform = 'none';
      cursor.classList.remove('is-on', 'is-click');
      void root.offsetWidth;
      root.classList.remove('is-resetting');
    }

    /* 모션을 끈 사용자에게 보여줄 완성 화면 */
    function renderFinal() {
      reset();
      setSelect('sys', labels(CONFIG.systems), CONFIG.systemTo); showSystem(CONFIG.systemTo);
      showScope(CONFIG.industryTo, CONFIG.profileTo, CONFIG.allowTo);
      setSelect('app', labels(CONFIG.approvals), CONFIG.approvalTo);
      appHint.textContent = CONFIG.approvals[CONFIG.approvalTo].hint;
    }

    async function play(t) {
      try {
        for (;;) {
          reset();
          await sleep(800, t);
          moveTo(point(stage, .72, .8)); void cursor.offsetWidth;
          cursor.classList.add('is-on');

          // 1. SAP 시스템을 클릭 한 번으로 전환
          await pick('sys', labels(CONFIG.systems), CONFIG.systemTo, t);
          var vals = [sys.url, sys.client, sys.user, sys.release];
          vals.forEach(function (v) { v.classList.add('is-load'); });
          await sleep(850, t);
          showSystem(CONFIG.systemTo);
          for (var i = 0; i < vals.length; i++) {
            vals[i].classList.remove('is-load'); bump(vals[i]);
            await sleep(110, t);
          }
          await sleep(1000, t);

          // 2. 범위 수정: 산업, 차단 목록 프로필, 허용 테이블
          scrollPage($('[data-card="scope"]'), compact ? 20 : 40);
          await sleep(1150, t);
          moveTo(point(editBtn, .5, .5));
          await sleep(760, t);
          editBtn.classList.add('is-hover');
          await sleep(220, t);
          click(); editBtn.classList.add('is-press');
          await sleep(150, t);
          editBtn.classList.remove('is-press', 'is-hover');
          root.classList.add('is-modal');
          await sleep(650, t);

          await pick('ind', CONFIG.industries, CONFIG.industryTo, t);
          root.classList.add('is-dirty');
          await sleep(350, t);
          await pick('pro', labels(CONFIG.profiles), CONFIG.profileTo, t);
          await sleep(350, t);
          await clickOn(allowIn, .5, .55, t);
          allowIn.classList.add('is-open');
          await sleep(260, t);
          for (var k = 0; k < CONFIG.allowTo.length; k++) {
            typed.textContent += CONFIG.allowTo[k];
            allowIn.classList.add('has-text');
            await sleep(60 + Math.random() * 60, t);
          }
          await sleep(350, t);

          await clickOn(save, .5, .55, t);
          allowIn.classList.remove('is-open');
          save.classList.add('is-press');
          await sleep(150, t);
          save.classList.remove('is-press');
          root.classList.remove('is-modal');
          await sleep(350, t);
          showScope(CONFIG.industryTo, CONFIG.profileTo, CONFIG.allowTo);
          bump(scope.industry);
          await sleep(140, t);
          bump(scope.profile);
          await sleep(140, t);
          bump(scope.allow);
          await sleep(1200, t);

          // 3. 세션: 무엇을 승인받을지 선택
          scrollPage($('[data-card="session"]'), compact ? 300 : 230);
          await sleep(1150, t);
          await pick('app', labels(CONFIG.approvals), CONFIG.approvalTo, t);
          appHint.textContent = CONFIG.approvals[CONFIG.approvalTo].hint;
          await sleep(700, t);
          cursor.classList.remove('is-on');
          await sleep(CONFIG.holdMs, t);

          root.classList.add('is-fading');
          await sleep(520, t);
        }
      } catch (e) { if (e !== CANCEL) throw e; }
    }

    function start() { if (running) return; running = true; play(++token); }
    function stop() { if (!running) return; running = false; token++; reset(); }

    fit();
    if ('ResizeObserver' in window) new ResizeObserver(fit).observe(root);
    else window.addEventListener('resize', fit);

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { renderFinal(); return; }

    reset();
    // 화면에 보일 때만 재생
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) {
        en[0].isIntersecting ? start() : stop();
      }, { threshold: .25 }).observe(root);
    } else { start(); }
  }

  [].forEach.call(document.querySelectorAll('[data-stx-settings]'), init);
})();
