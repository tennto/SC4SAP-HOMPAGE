<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP AI 포탈 히어로 데모 모션: 납기 지연 구매오더</title>

<!-- 미리보기 페이지용 스타일. 랜딩페이지에 붙일 때는 필요 없습니다. -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         padding: 48px 24px; box-sizing: border-box; background: #0c0d10; transition: background .3s; }
  body.pv-light { background: #ffffff; }
  .preview-wrap { width: 100%; max-width: 1120px; }
  .pv-bar { display: flex; gap: 6px; margin-bottom: 16px; font: 13px/1 -apple-system, "Malgun Gothic", sans-serif; }
  .pv-bar button { padding: 8px 14px; border-radius: 8px; border: 1px solid #8884; background: none;
                   color: #888c91; font: inherit; cursor: pointer; }
  .pv-bar button[aria-pressed="true"] { background: #888c91; border-color: #888c91; color: #fff; }
</style>


<!-- ================================================================
     여기부터 복사: (1) 폰트 링크  (2) <style>  (3) #sap-demo  (4) <script>
     ================================================================ -->

<!-- (1) Pretendard. 이미 사이트에서 쓰고 있다면 이 줄은 빼도 됩니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- (2) 스타일. 모든 클래스가 sapd- 로 시작해서 기존 CSS와 충돌하지 않습니다. -->
<style>
.sapd {
  /* 색상: 실제 포탈 화면에서 추출 */
  --bg: #111317;
  --panel: #171a1f;
  --raised: #252a31;
  --line: #2b2f36;
  --line-strong: #383b40;
  --ink: #e6e9ee;
  --ink-2: #bdbfc4;
  --muted: #888c91;
  --dim: #63666c;
  --bad: #f2786d;
  --good: #56d39a;
  --bad-rgb: 242, 120, 109;
  --good-rgb: 86, 211, 154;
  --bubble: #252a31;
  --well: #0d0f12;
  --composer-line: #30343a;
  --focus-line: #4b5058;
  --send-off: #25282d;
  --send-off-ink: #4a4e55;
  --faint: #4a4e55;
  --spin: #3f444c;
  --hair: rgba(255, 255, 255, .045);
  --track: rgba(255, 255, 255, .06);
  --frame: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 80px -24px rgba(0, 0, 0, .7);
  --cursor-fill: #ffffff;
  --cursor-line: #111317;
  --cursor-shadow: rgba(0, 0, 0, .5);

  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR",
          "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --mono: "JetBrains Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, .8, .24, 1);

  /* 레이아웃 좌표 (스테이지 기준 px) */
  --colw: 760px;
  --greet-y: 258px;
  --cy-home: 330px;
  --cy-chat: 530px;
  --thread-top: 36px;

  position: relative;
  width: 100%;
  aspect-ratio: 1200 / 640;
  overflow: hidden;
  border-radius: 14px;
  background: var(--bg);
  box-shadow: var(--frame);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  pointer-events: none;
  visibility: hidden;
}
.sapd.is-ready { visibility: visible; }

/* 라이트 테마: <div class="sapd" data-theme="light">. 속성을 빼면 다크입니다. */
.sapd[data-theme="light"] {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --raised: #eceef2;
  --line: #e2e4e8;
  --line-strong: #d6d8dd;
  --ink: #2f3540;
  --ink-2: #4a4f59;
  --muted: #70747c;
  --dim: #989aa0;
  --bad: #d9483f;
  --good: #1a9460;
  --bad-rgb: 217, 72, 63;
  --good-rgb: 26, 148, 96;
  --bubble: #e6e8ed;
  --well: #ffffff;
  --composer-line: #cdd0d3;
  --focus-line: #8d9096;
  --send-off: #eceef2;
  --send-off-ink: #b4b8bf;
  --faint: #b4b8bf;
  --spin: #d5d8dd;
  --hair: rgba(47, 53, 64, .07);
  --track: rgba(47, 53, 64, .08);
  --frame: 0 0 0 1px rgba(47, 53, 64, .1), 0 30px 70px -30px rgba(47, 53, 64, .28);
  --cursor-fill: #2f3540;
  --cursor-line: #ffffff;
  --cursor-shadow: rgba(47, 53, 64, .3);
}
.sapd *, .sapd *::before, .sapd *::after { box-sizing: border-box; }

/* 좁은 화면: 사이드바를 빼고 채팅만 크게 */
.sapd.is-compact {
  aspect-ratio: 480 / 560;
  --colw: 436px;
  --greet-y: 190px;
  --cy-home: 252px;
  --cy-chat: 454px;
  --thread-top: 22px;
}

.sapd-stage {
  position: absolute; top: 0; left: 0;
  width: 1200px; height: 640px;
  display: flex;
  transform-origin: 0 0;
  transform: scale(var(--s, 1));
  font-size: 14px; line-height: 1.5;
}
.sapd.is-compact .sapd-stage { width: 480px; height: 560px; }
.sapd-sprite { position: absolute; width: 0; height: 0; }
.sapd-i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
          stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 사이드바 ---------- */
.sapd-side {
  width: 232px; flex: none; padding: 10px 9px;
  background: var(--panel); border-right: 1px solid var(--line-strong);
}
.sapd.is-compact .sapd-side { display: none; }
.sapd-new {
  height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line-strong); border-radius: 9px;
  font-size: 13px; font-weight: 600;
}
.sapd-sec {
  display: flex; align-items: center; justify-content: space-between;
  margin: 24px 4px 0; font-size: 11.5px; font-weight: 600; color: var(--muted);
}
.sapd-sec > span:last-child { display: flex; align-items: center; gap: 10px; font-weight: 400; }
.sapd-sec .sapd-i { width: 14px; height: 14px; }
.sapd-day { margin: 18px 4px 5px; font-size: 10.5px; color: var(--dim); }
.sapd-sec + .sapd-day { margin-top: 14px; }
.sapd-item {
  height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 9px;
  border-radius: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap;
}
.sapd-item .sapd-i { width: 14px; height: 14px; color: var(--muted); }
.sapd-item.is-active { background: var(--raised); color: var(--ink); font-weight: 500; }
.sapd-title { transition: opacity .25s; }
.sapd-title.is-swap { opacity: 0; }

/* ---------- 메인 ---------- */
.sapd-main { position: relative; flex: 1; min-width: 0; transition: opacity .45s; }
.sapd.is-fading .sapd-main { opacity: 0; }
.sapd-col { position: absolute; left: 50%; width: var(--colw); margin-left: calc(var(--colw) / -2); }

.sapd-greet {
  top: var(--greet-y); margin-top: 0; margin-bottom: 0; text-align: center;
  font-size: 27px; font-weight: 500; letter-spacing: -.02em;
  transition: opacity .4s, transform .6s var(--ease);
}
.sapd.is-chat .sapd-greet { opacity: 0; transform: translateY(-16px); }

/* 입력창 */
.sapd-composer {
  top: 0; height: 86px;
  transform: translateY(var(--cy-home));
  background: var(--panel); border: 1px solid var(--composer-line); border-radius: 14px;
  transition: transform .75s var(--ease), border-color .2s;
}
.sapd.is-chat .sapd-composer { transform: translateY(var(--cy-chat)); }
.sapd.is-focus .sapd-composer { border-color: var(--focus-line); }
.sapd-input { padding: 15px 18px 0; font-size: 15px; white-space: nowrap; }
.sapd-ph { color: var(--dim); }
.sapd.has-text .sapd-ph { display: none; }
.sapd-caret {
  display: none; width: 1.5px; height: 17px; margin: 0 1px -3px;
  background: var(--ink); animation: sapd-blink 1s steps(1) infinite;
}
.sapd.is-focus .sapd-caret { display: inline-block; }
.sapd-bar {
  position: absolute; left: 16px; right: 12px; bottom: 11px;
  display: flex; align-items: center; gap: 14px;
  font-size: 12.5px; color: var(--muted);
}
.sapd-model { display: flex; align-items: center; gap: 8px; }
.sapd-model .sapd-i { width: 13px; height: 13px; }
.sapd-send {
  margin-left: auto; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--send-off); color: var(--send-off-ink);
  transition: background .25s, color .25s, transform .14s;
}
.sapd-send .sapd-i { stroke-width: 1.8; }
.sapd.has-text .sapd-send { background: var(--ink); color: var(--bg); }
.sapd-send.is-press { transform: scale(.88); }

/* 대화 */
.sapd-thread { top: 0; padding-top: var(--thread-top); display: flex; flex-direction: column; }
.sapd-rv { opacity: 0; transform: translateY(8px);
           transition: opacity .45s var(--ease), transform .45s var(--ease); }
.sapd-rv.is-in { opacity: 1; transform: none; }

.sapd-user {
  align-self: flex-end; max-width: 84%; padding: 9px 15px;
  background: var(--bubble); border-radius: 16px 16px 4px 16px; font-size: 15px;
}
.sapd-ai { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }

/* SAP 조회 단계 */
.sapd-tool { border: 1px solid var(--line); border-radius: 10px; }
.sapd-tool-head {
  height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--ink-2);
}
.sapd-sys {
  margin-left: auto; display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11.5px; color: var(--muted);
}
.sapd-sys i { width: 6px; height: 6px; border-radius: 50%; background: var(--good);
              animation: sapd-pulse 2s ease-out infinite; }
.sapd-tool-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--ease); }
.sapd-tool-body.is-collapsed { grid-template-rows: 0fr; }
.sapd-tool-body ul { margin: 0; padding: 0 12px; list-style: none; overflow: hidden; }
.sapd-tool-body li {
  height: 0; opacity: 0; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--muted);
  transition: height .35s var(--ease), opacity .35s, margin .35s var(--ease);
}
.sapd-tool-body li.is-in { height: 27px; opacity: 1; }
.sapd-tool-body li.is-in:last-child { margin-bottom: 9px; }
.sapd-tool-body code { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }

.sapd-ico { position: relative; width: 13px; height: 13px; flex: none; border-radius: 50%; }
.sapd-ico[data-state="run"] {
  border: 1.5px solid var(--spin); border-top-color: var(--ink-2);
  animation: sapd-spin .7s linear infinite;
}
.sapd-ico[data-state="done"]::after {
  content: ""; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px;
  border: solid var(--good); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg);
}

/* 답변 */
.sapd-answer { margin: 0; min-height: 25px; font-size: 15px; line-height: 1.65; }
.sapd-answer strong { font-weight: 600; }
.sapd-answer code {
  padding: 1px 6px; border-radius: 5px; background: var(--raised);
  font-family: var(--mono); font-size: 12.5px;
}

/* 조회 결과 표 */
.sapd-table { border: 1px solid var(--line); border-radius: 10px; background: var(--well); overflow: hidden; }
.sapd-tr {
  display: grid; grid-template-columns: 126px 1fr 1.3fr 82px 178px;
  align-items: center; column-gap: 14px; height: 36px; padding: 0 14px;
  font-size: 13px; color: var(--ink-2); white-space: nowrap;
}
.sapd.is-compact .sapd-tr { grid-template-columns: 88px 1fr 46px 112px; column-gap: 10px; height: 32px; padding: 0 12px; }
.sapd.is-compact .sapd-c-item { display: none; }
.sapd-th { border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.sapd-row {
  opacity: 0; transform: translateY(6px);
  transition: opacity .4s var(--ease), transform .4s var(--ease);
}
.sapd-row.is-in { opacity: 1; transform: none; }
.sapd-row + .sapd-row { box-shadow: inset 0 1px 0 var(--hair); }
.sapd-po { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.sapd-date { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.sapd-c-item { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.sapd-delay { display: flex; align-items: center; gap: 10px; }
.sapd-delay span { flex: 1; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.sapd-delay i {
  display: block; width: 0; height: 100%; border-radius: 2px; background: var(--bad);
  transition: width .9s var(--ease) .1s;
}
.sapd-row.is-in .sapd-delay i { width: var(--w); }
.sapd-delay b {
  width: 34px; flex: none; text-align: right;
  font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--bad);
  font-variant-numeric: tabular-nums;
}

/* 마우스 커서 */
.sapd-cursor {
  position: absolute; top: 0; left: 0; z-index: 5; width: 20px; height: 20px;
  opacity: 0; transition: transform .7s var(--ease), opacity .3s;
}
.sapd-cursor.is-on { opacity: 1; }
.sapd.is-compact .sapd-cursor { display: none; }
.sapd-cursor svg { display: block; width: 20px; height: 20px; filter: drop-shadow(0 2px 3px var(--cursor-shadow)); }
.sapd-cursor path { fill: var(--cursor-fill); stroke: var(--cursor-line); }
.sapd-cursor::after {
  content: ""; position: absolute; left: -9px; top: -10px; width: 24px; height: 24px;
  border-radius: 50%; border: 1.5px solid var(--ink); opacity: 0;
}
.sapd-cursor.is-click::after { animation: sapd-click .45s ease-out; }

.sapd.is-resetting, .sapd.is-resetting * { transition: none !important; }

@keyframes sapd-blink { 50% { opacity: 0; } }
@keyframes sapd-spin { to { transform: rotate(360deg); } }
@keyframes sapd-pulse { 0% { box-shadow: 0 0 0 0 rgba(var(--good-rgb), .45); } 70%, 100% { box-shadow: 0 0 0 6px rgba(var(--good-rgb), 0); } }
@keyframes sapd-click { 0% { opacity: .7; transform: scale(.3); } 100% { opacity: 0; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .sapd, .sapd * { transition: none !important; animation: none !important; }
}
</style>
</head>

<body>
<div class="preview-wrap">

<!-- 미리보기 전용 테마 전환 버튼. 복사하지 않아도 됩니다. -->
<div class="pv-bar">
  <button type="button" data-pv="light" aria-pressed="true" data-t="pvLight">라이트</button>
  <button type="button" data-pv="dark" aria-pressed="false" data-t="pvDark">다크</button>
</div>
<script>
  document.body.classList.add('pv-light');
  document.querySelector('.pv-bar').addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-pv'); if (!t) return;
    var demo = document.getElementById('sap-demo');
    t === 'light' ? demo.setAttribute('data-theme', 'light') : demo.removeAttribute('data-theme');
    document.body.classList.toggle('pv-light', t === 'light');
    [].forEach.call(this.children, function (b) { b.setAttribute('aria-pressed', b === e.target); });
  });
</script>

<!-- (3) 마크업. 히어로 섹션에서 데모가 들어갈 자리에 넣으세요. 부모 너비에 맞춰 자동으로 축소됩니다. -->
<div class="sapd" id="sap-demo" data-theme="light" role="img"
     aria-label="SAP AI 포탈 데모: 납기 지연된 구매오더를 물으면 연결된 SAP 시스템을 조회해 지연 일수 순으로 정리한 표를 보여줍니다.">
  <div class="sapd-stage" aria-hidden="true">

    <svg class="sapd-sprite">
      <symbol id="sapd-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
      <symbol id="sapd-plus-circle" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3"/><path d="M8 5.3v5.4M5.3 8h5.4"/></symbol>
      <symbol id="sapd-sliders" viewBox="0 0 16 16"><path d="M2 5h6.5M12 5h2M2 11h2M7.5 11H14"/><circle cx="10.2" cy="5" r="1.6"/><circle cx="5.8" cy="11" r="1.6"/></symbol>
      <symbol id="sapd-chat" viewBox="0 0 16 16"><path d="M8 2.5c3.2 0 5.5 2.1 5.5 4.9s-2.3 4.9-5.5 4.9c-.6 0-1.2-.1-1.7-.2l-2.9 1.4.6-2.5C3 10.1 2.5 8.8 2.5 7.4 2.5 4.6 4.8 2.5 8 2.5Z"/></symbol>
      <symbol id="sapd-bolt" viewBox="0 0 16 16"><path d="M9 1.8 3.5 9H8l-1 5.2L12.5 7H8l1-5.2Z"/></symbol>
      <symbol id="sapd-chev" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></symbol>
      <symbol id="sapd-up" viewBox="0 0 16 16"><path d="M8 13V3.5M3.8 7.6 8 3.4l4.2 4.2"/></symbol>
    </svg>

    <aside class="sapd-side">
      <div class="sapd-new"><svg class="sapd-i"><use href="#sapd-plus-circle"/></svg><span data-t="newChat">새 채팅</span></div>
      <div class="sapd-sec"><span data-t="projects">프로젝트</span> <svg class="sapd-i"><use href="#sapd-plus"/></svg></div>
      <div class="sapd-sec"><span data-t="recent">최근</span> <span><svg class="sapd-i"><use href="#sapd-sliders"/></svg><span data-t="viewAll">모두 보기</span></span></div>
      <div class="sapd-day" data-t="today">오늘</div>
      <div class="sapd-item is-active"><svg class="sapd-i"><use href="#sapd-chat"/></svg><span class="sapd-title" data-t="homeTitle">새 대화</span></div>
      <div class="sapd-day" data-t="last7">지난 7일</div>
      <div class="sapd-item"><svg class="sapd-i"><use href="#sapd-chat"/></svg>Object type: Program</div>
      <div class="sapd-item"><svg class="sapd-i"><use href="#sapd-bolt"/></svg>Analyze Code · ZMMR00020</div>
      <div class="sapd-item"><svg class="sapd-i"><use href="#sapd-bolt"/></svg>Ask a Consultant</div>
      <div class="sapd-item"><svg class="sapd-i"><use href="#sapd-chat"/></svg><span data-t="pastChat">이번 달 입고 현황</span></div>
    </aside>

    <div class="sapd-main">
      <p class="sapd-col sapd-greet" data-t="greet">반가워요, Sihun님!</p>

      <div class="sapd-col sapd-thread">
        <div class="sapd-user sapd-rv"></div>
        <div class="sapd-ai">
          <div class="sapd-tool sapd-rv">
            <div class="sapd-tool-head">
              <span class="sapd-ico" data-state="run"></span>
              <span class="sapd-tool-label"></span>
              <span class="sapd-sys"><i></i><span class="sapd-sys-name"></span></span>
            </div>
            <div class="sapd-tool-body"><ul></ul></div>
          </div>
          <p class="sapd-answer"></p>
          <div class="sapd-table sapd-rv">
            <div class="sapd-tr sapd-th">
              <span data-t="thPo">구매오더</span><span data-t="thVendor">공급업체</span><span class="sapd-c-item" data-t="thItem">품목</span><span data-t="thDue">납기일</span><span data-t="thDelay">지연</span>
            </div>
            <div class="sapd-tbody"></div>
          </div>
        </div>
      </div>

      <div class="sapd-col sapd-composer">
        <div class="sapd-input"><span class="sapd-typed"></span><i class="sapd-caret"></i><span class="sapd-ph" data-t="placeholder">SAP 시스템에 대해 무엇이든 물어보세요...</span></div>
        <div class="sapd-bar">
          <svg class="sapd-i"><use href="#sapd-plus"/></svg>
          <span class="sapd-model">Haiku <svg class="sapd-i"><use href="#sapd-chev"/></svg></span>
          <span class="sapd-send"><svg class="sapd-i"><use href="#sapd-up"/></svg></span>
        </div>
      </div>
    </div>

      prompt: '納期遅延の購買発注を見せて',

  };
  var L = I18N[LANG];

    ],

    // days: 납기일에서 지난 일수. 납기일 날짜는 방문한 날 기준으로 자동 계산됩니다.
    rows: [
      { po: '4500018274', vendor: L.vendors[0], item: L.items[0], days: 12 },
      { po: '4500018311', vendor: L.vendors[1], item: L.items[1], days: 9 },
      { po: '4500018352', vendor: L.vendors[2], item: L.items[2], days: 6 },
      { po: '4500018407', vendor: L.vendors[3], item: L.items[3], days: 3 },
      { po: '4500018433', vendor: L.vendors[4], item: L.items[4], days: 2 }

  };
  /* ------------------------------------------------------ */

  root.setAttribute('aria-label', L.aria);
  [].forEach.call(document.querySelectorAll('[data-t]'), function (el) {
    var v = L[el.getAttribute('data-t')];
    if (typeof v === 'string') el.textContent = v;
  });

  var $ = function (s) { return root.querySelector(s); };
  var stage = $('.sapd-stage'), typed = $('.sapd-typed'), send = $('.sapd-send'),
      cursor = $('.sapd-cursor'), title = $('.sapd-title'), user = $('.sapd-user'),
      tool = $('.sapd-tool'), toolIco = $('.sapd-tool-head .sapd-ico'),
      toolLabel = $('.sapd-tool-label'), toolBody = $('.sapd-tool-body'), list = $('.sapd-tool-body ul'),
      answer = $('.sapd-answer'), table = $('.sapd-table'), tbody = $('.sapd-tbody');

  var HOME_TITLE = title.textContent;
  var scale = 1, token = 0, running = false, CANCEL = {};
  var langGen = 0;                          // 언어가 바뀔 때마다 하나씩 올라갑니다 (타이핑·답변 스트리밍이 봅니다)

  var steps = [].slice.call(list.children);

  var maxDays = Math.max.apply(null, CONFIG.rows.map(function (r) { return r.days; }));
  function due(days) {
    var d = new Date(); d.setDate(d.getDate() - days);
    return ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2);
  }
  tbody.innerHTML = CONFIG.rows.map(function (r) {
    return '<div class="sapd-tr sapd-row">' +
      '<span class="sapd-po">' + esc(r.po) + '</span>' +
      '<span>' + esc(r.vendor) + '</span>' +
      '<span class="sapd-c-item">' + esc(r.item) + '</span>' +
      '<span class="sapd-date">' + due(r.days) + '</span>' +
      '<span class="sapd-delay"><span><i style="--w:' + Math.round(r.days / maxDays * 100) + '%"></i></span>' +

    root.classList.add('is-ready');
  }

  function sleep(ms, t) {
    return new Promise(function (res, rej) {
      setTimeout(function () { t === token ? res() : rej(CANCEL); }, ms);
    });
  }
  function show(el) { el.classList.add('is-in'); }

  function renderAnswer() {
    answer.innerHTML = CONFIG.answer.map(function (s) {
      var tag = s.code ? 'code' : s.strong ? 'strong' : '';
      return tag ? '<' + tag + '>' + esc(s.t) + '</' + tag + '>' : esc(s.t);
    }).join('');
  }

  /* 처음 상태로 (전환 없이) */
  function reset() {
    root.classList.add('is-resetting');
    root.classList.remove('is-chat', 'is-focus', 'has-text');
    [].forEach.call(root.querySelectorAll('.sapd-rv, .sapd-step, .sapd-row'), function (el) { el.classList.remove('is-in'); });
    [].forEach.call(root.querySelectorAll('.sapd-ico'), function (el) { el.dataset.state = 'run'; });
    typed.textContent = ''; user.textContent = ''; answer.innerHTML = '';
    title.textContent = HOME_TITLE; title.classList.remove('is-swap');
    toolLabel.textContent = CONFIG.toolRunning;
    toolBody.classList.remove('is-collapsed');
    send.classList.remove('is-press');
    cursor.classList.remove('is-on', 'is-click');
    void root.offsetWidth;
    root.classList.remove('is-resetting');
  }

  function renderFinal() {

  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function frames(ch) {

  }
  /* 질문은 매 글자 CONFIG.prompt 에서 새로 읽습니다. 도중에 언어가 바뀌면 같은 진행 비율의

  async function type(t) {
    var text = CONFIG.prompt, g = langGen;
    for (var i = 0; i < text.length; i++) {
      if (g !== langGen) {
        i = Math.min(CONFIG.prompt.length, Math.round(i / text.length * CONFIG.prompt.length));
        text = CONFIG.prompt; g = langGen;
        if (i >= text.length) break;
      }
      var done = text.slice(0, i), f = frames(text[i]);
      for (var j = 0; j < f.length; j++) {
        if (g !== langGen) break;

      if (g !== langGen) { i--; continue; }
      if (text[i] === ' ') await sleep(70, t);

  /* 도중에 언어가 바뀌면 setLang 이 답변을 새 언어로 통째로 그려 두므로 여기서 멈춥니다 */
  async function stream(t) {

      }

        typed.textContent = '';
        root.classList.remove('has-text', 'is-focus');

          await sleep(190, t);

        await sleep(520, t);

  /* 재생을 멈추거나 되감지 않고 언어만 바꿉니다. 화면에 이미 있는 문구는 같은 자리에서
     바꾸고, 앞으로 그릴 문구는 CONFIG 를 고쳐 두어 새 언어로 나옵니다 */
  function setLang(next) {
    next = String(next || 'ko').toLowerCase();
    next = next.indexOf('ja') === 0 ? 'ja' : next.indexOf('en') === 0 ? 'en' : 'ko';
    if (next === LANG) return;
    var O = L, N = I18N[next];
    var oldPrompt = CONFIG.prompt;
    LANG = next; L = N; langGen++;
    document.documentElement.lang = next;
    document.title = N.docTitle;
    root.setAttribute('aria-label', N.aria);

    CONFIG.prompt = N.prompt; CONFIG.chatTitle = N.chatTitle;
    CONFIG.toolRunning = N.toolRunning; CONFIG.toolDone = N.toolDone;
    CONFIG.steps.forEach(function (s, i) { s.text = N.steps[i]; });
    CONFIG.answer = N.answer;
    CONFIG.rows.forEach(function (r, i) { r.vendor = N.vendors[i]; r.item = N.items[i]; });

    // 마크업 문구. 제목은 홈/대화 상태에 따라 다른 문구라서 따로
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      if (el === title) return;
      var v = N[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    var wasHome = title.textContent === HOME_TITLE;
    HOME_TITLE = N.homeTitle;
    if (wasHome) title.textContent = HOME_TITLE;
    else if (title.textContent === O.chatTitle) title.textContent = N.chatTitle;

    // 스크립트가 만든 문구
    steps.forEach(function (li, i) {
      var tn = li.childNodes[1];
      if (tn && tn.nodeType === 3) tn.nodeValue = N.steps[i] + ' ';
    });
    rows.forEach(function (row, i) {
      var c = row.children;
      c[1].textContent = N.vendors[i]; c[2].textContent = N.items[i];
      c[4].querySelector('b').textContent = CONFIG.rows[i].days + N.dayUnit;
    });
    if (toolLabel.textContent === O.toolRunning) toolLabel.textContent = N.toolRunning;
    else if (toolLabel.textContent === O.toolDone) toolLabel.textContent = N.toolDone;
    if (user.textContent === oldPrompt) user.textContent = N.prompt;
    if (answer.textContent) renderAnswer();
    if (typed.textContent) {
      var n = Math.round(typed.textContent.length / oldPrompt.length * N.prompt.length);
      typed.textContent = N.prompt.slice(0, Math.max(1, n));
    }
  }
  window.__reelSetLang = setLang;

  function start() { if (running) return; running = true; play(++token); }
  function stop() { if (!running) return; running = false; token++; root.classList.remove('is-fading'); reset(); }

  fit();
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(root);
  else window.addEventListener('resize', fit);

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { renderFinal(); return; }

  reset();
  // 화면에 보일 때만 재생
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) {
      en[0].isIntersecting ? start() : stop();
    }, { threshold: .25 }).observe(root);
  } else { start(); }
})();
