<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MCP 모니터 데모 모션 (다크)</title>

<!-- 미리보기 페이지용 스타일. 랜딩페이지에 붙일 때는 필요 없습니다. -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         padding: 48px 24px; box-sizing: border-box; background: #0c0d10; }
  .preview-wrap { width: 100%; max-width: 1120px; }
</style>


<!-- ================================================================
     여기부터 복사: (1) 폰트 링크  (2) <style>  (3) .mcx 마크업  (4) <script>
     ================================================================ -->

<!-- (1) Pretendard. 이미 사이트에서 쓰고 있다면 이 줄은 빼도 됩니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- (2) 스타일. 모든 클래스가 mcx- 로 시작해서 다른 데모(sapd-, spx-)와 충돌하지 않습니다. -->
<style>
.mcx {
  /* 다크 테마 (기본) */
  --bg: #111317;
  --card: #171a1f;
  --line: #2b2f36;
  --line-strong: #383b40;
  --field-line: #3a3e45;
  --ink: #e6e9ee;
  --ink-2: #bdbfc4;
  --muted: #888c91;
  --dim: #6f737a;
  --track: #2a2e35;
  --seg: #9aa0aa;
  --bar: #6b7079;
  --good: #56d39a;
  --bad: #f2786d;
  --warn: #e2b04a;
  --flash: rgba(86, 211, 154, .09);
  --edge: rgba(255, 255, 255, .06);
  --frame: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 80px -24px rgba(0, 0, 0, .7);
  --cursor-fill: #ffffff;
  --cursor-line: #111317;
  --cursor-shadow: rgba(0, 0, 0, .5);

  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --mono: "JetBrains Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, Consolas, "Hiragino Sans", "Yu Gothic UI", "Meiryo", monospace;
  --ease: cubic-bezier(.22, .8, .24, 1);

  position: relative;
  width: 100%;
  aspect-ratio: 1200 / 640;
  overflow: hidden;
  border-radius: 14px;
  background: var(--bg);
  box-shadow: var(--frame);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  pointer-events: none;
  visibility: hidden;
}
/* 라이트 테마: <div class="mcx" data-theme="light"> */
.mcx[data-theme="light"] {
  --bg: #f4f5f7;
  --card: #ffffff;
  --line: #eaeaec;
  --line-strong: #d5d7d9;
  --field-line: #c9cdd1;
  --ink: #2f3540;
  --ink-2: #4a4f59;
  --muted: #6d7179;
  --dim: #a0a3a9;
  --track: #e7eaee;
  --seg: #6d7179;
  --bar: #8d9096;
  --good: #15803d;
  --bad: #b91c1c;
  --warn: #ca8a04;
  --flash: rgba(21, 128, 61, .07);
  --edge: rgba(47, 53, 64, .06);
  --frame: 0 0 0 1px rgba(47, 53, 64, .1), 0 30px 70px -30px rgba(47, 53, 64, .28);
  --cursor-fill: #2f3540;
  --cursor-line: #ffffff;
  --cursor-shadow: rgba(47, 53, 64, .3);
}
.mcx.is-ready { visibility: visible; }
.mcx.is-compact { aspect-ratio: 480 / 700; }
.mcx *, .mcx *::before, .mcx *::after { box-sizing: border-box; }

.mcx-stage {
  position: absolute; top: 0; left: 0;
  width: 1200px; height: 640px;
  transform-origin: 0 0;
  transform: scale(var(--s, 1));
  font-size: 13px; line-height: 1.5;
  transition: opacity .45s;
}
.mcx.is-compact .mcx-stage { width: 480px; height: 700px; }
.mcx.is-fading .mcx-stage { opacity: 0; }
.mcx-sprite { position: absolute; width: 0; height: 0; }
.mcx-i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor;
         stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 페이지 ---------- */
.mcx-page { position: absolute; top: 0; left: 0; width: 100%; padding: 24px 32px 20px;
            transition: transform 1.1s var(--ease); }
.mcx.is-compact .mcx-page { padding: 18px 16px 16px; }
.mcx-eyebrow { font-size: 10.5px; color: var(--muted); }
.mcx-title { margin: 4px 0 0; font-size: 23px; font-weight: 700; letter-spacing: -.02em; }
.mcx-desc { margin: 8px 0 0; max-width: 500px; font-size: 13px; line-height: 1.65; color: var(--muted); }
.mcx-rule { height: 1px; margin: 18px 0 16px; background: var(--line-strong); }

.mcx-card { padding: 18px 20px 20px; border-radius: 14px; background: var(--card);
            box-shadow: 0 0 0 1px var(--edge), 0 1px 2px rgba(0, 0, 0, .04); }
.mcx-card + .mcx-card { margin-top: 14px; }
.mcx.is-compact .mcx-card { padding: 14px; }
.mcx-head { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700; }
.mcx-head .mcx-i { color: var(--muted); }

/* ---------- 지표 타일 ---------- */
.mcx-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
.mcx.is-compact .mcx-tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
.mcx-tile { position: relative; height: 150px; padding: 14px 16px;
            border: 1px solid var(--line-strong); border-radius: 10px; }
.mcx.is-compact .mcx-tile { height: 142px; padding: 12px; }
.mcx-k { font-size: 11px; color: var(--muted); }
.mcx-big { margin-top: 6px; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em;
           font-variant-numeric: tabular-nums; }
.mcx-big small { margin-left: 5px; font-size: 11.5px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.mcx-num { display: inline-block; }
.mcx-num.is-bump { animation: mcx-bump .5s var(--ease); }
.mcx-foot { position: absolute; left: 16px; right: 16px; bottom: 13px; font-size: 11px; line-height: 1.7; color: var(--muted); }
.mcx.is-compact .mcx-foot { left: 12px; right: 12px; bottom: 10px; font-size: 10.5px; line-height: 1.55; }
.mcx-foot code { font-family: var(--mono); font-size: .95em; }

.mcx-split { margin-top: 18px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.mcx.is-compact .mcx-split { margin-top: 10px; }
.mcx-split i { display: block; height: 100%; width: var(--w, 0%); border-radius: 4px 0 0 4px; background: var(--seg);
               transition: width .6s var(--ease); }

.mcx-donut-row { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 8px; }
.mcx.is-compact .mcx-donut-row { gap: 12px; justify-content: flex-start; margin-top: 10px; }
.mcx-donut { position: relative; width: 84px; height: 84px; flex: none; }
.mcx.is-compact .mcx-donut { width: 68px; height: 68px; }
.mcx-donut svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.mcx-donut circle { fill: none; stroke-width: 9; }
.mcx-donut b { position: absolute; inset: 0; display: grid; place-items: center;
               font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mcx.is-compact .mcx-donut b { font-size: 12px; }
.mcx-legend { display: grid; grid-template-columns: 9px auto 28px; gap: 5px 8px; align-items: center;
              font-size: 11px; color: var(--muted); }
.mcx-legend i { width: 8px; height: 8px; border-radius: 2px; }
.mcx-legend span:nth-child(3n) { text-align: right; font-variant-numeric: tabular-nums; }

.mcx-bars { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: 88px; margin-top: 2px; }
.mcx.is-compact .mcx-bars { height: 80px; }
.mcx-bars div { display: flex; flex-direction: column; align-items: center;
                font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mcx-bars span:first-child { margin-bottom: 3px; }
.mcx-bars span:last-child { align-self: stretch; padding-top: 3px; border-top: 1px solid var(--line-strong);
                            text-align: center; color: var(--dim); }
.mcx-bars i { width: 28px; height: var(--h, 0px); border-radius: 4px 4px 0 0; background: var(--bar);
              transition: height .6s var(--ease); }
.mcx.is-compact .mcx-bars i { width: 20px; }
.mcx-bars div:first-child span:first-child { color: var(--ink); font-weight: 700; }
.mcx-bars div:first-child i { background: var(--ink); }
.mcx-tile-top .mcx-foot { bottom: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 호출 목록 ---------- */
.mcx-live { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: var(--good); }
.mcx-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); animation: mcx-pulse 1.8s ease-out infinite; }
.mcx-sub { margin: 6px 0 0; font-size: 11.5px; color: var(--dim); }
.mcx-filters { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 12.5px; }
.mcx-field { height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 9px;
             border: 1px solid var(--field-line); border-radius: 8px; white-space: nowrap; }
.mcx-field .mcx-i { color: var(--muted); }
.mcx-search { width: 356px; color: var(--dim); overflow: hidden; }
.mcx-select { width: 126px; }
.mcx-select .mcx-i:last-child { margin-left: auto; }
.mcx-space { flex: 1; }
.mcx-check { width: 13px; height: 13px; border: 1.4px solid var(--muted); border-radius: 3.5px;
             display: grid; place-items: center; transition: background .2s, border-color .2s; }
.mcx-check::after { content: ""; width: 3.5px; height: 6.5px; margin-top: -1.5px; border: solid var(--card);
                    border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); opacity: 0; }
.mcx.is-mcp-only .mcx-check { background: var(--ink); border-color: var(--ink); }
.mcx.is-mcp-only .mcx-check::after { opacity: 1; }
.mcx-mcp { transition: border-color .2s, transform .14s; font-weight: 500; }
.mcx.is-mcp-only .mcx-mcp { border-color: var(--ink); }
.mcx-mcp.is-press { transform: scale(.94); }
.mcx.is-compact .mcx-x { display: none; }
.mcx.is-compact .mcx-search { flex: 1; width: auto; }

.mcx-list { border-top: 1px solid var(--line); }
.mcx-row {
  display: grid; grid-template-columns: 22px 108px 232px 1fr 62px 50px; align-items: center;
  height: 46px; padding: 0 4px; border-bottom: 1px solid var(--line); overflow: hidden;
  transition: height .5s var(--ease), opacity .4s, border-color .4s;
}
.mcx.is-compact .mcx-row { grid-template-columns: 18px 66px 1fr 56px; }
.mcx-row.is-new { animation: mcx-flash 1.6s ease-out; }
.mcx-row.is-out { height: 0; opacity: 0; border-color: transparent; }
.mcx-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.mcx-time { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.mcx.is-compact .mcx-date { display: none; }
.mcx-tool { font-family: var(--mono); font-size: 12px; line-height: 1.35; color: var(--ink); }
.mcx-tool small { display: block; font-size: 9.5px; color: var(--dim); }
.mcx-arg { font-family: var(--mono); font-size: 11px; color: var(--muted);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; }
.mcx-ms { text-align: right; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- 마우스 커서 ---------- */
.mcx-cursor { position: absolute; top: 0; left: 0; z-index: 5; width: 20px; height: 20px;
              opacity: 0; transition: transform .8s var(--ease), opacity .3s; }
.mcx-cursor.is-on { opacity: 1; }
.mcx.is-compact .mcx-cursor { display: none; }
.mcx-cursor svg { display: block; width: 20px; height: 20px; filter: drop-shadow(0 2px 3px var(--cursor-shadow)); }
.mcx-cursor path { fill: var(--cursor-fill); stroke: var(--cursor-line); }
.mcx-cursor::after { content: ""; position: absolute; left: -9px; top: -10px; width: 24px; height: 24px;
                     border-radius: 50%; border: 1.5px solid var(--ink); opacity: 0; }
.mcx-cursor.is-click::after { animation: mcx-click .45s ease-out; }

.mcx.is-resetting, .mcx.is-resetting * { transition: none !important; animation: none !important; }

@keyframes mcx-pulse { 0% { box-shadow: 0 0 0 0 var(--good); opacity: 1; } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
@keyframes mcx-flash { 0%, 25% { background: var(--flash); } 100% { background: transparent; } }
@keyframes mcx-bump { 0% { transform: translateY(-5px); opacity: .4; } 100% { transform: none; opacity: 1; } }
@keyframes mcx-click { 0% { opacity: .7; transform: scale(.3); } 100% { opacity: 0; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .mcx, .mcx * { transition: none !important; animation: none !important; }
}
</style>
</head>

<body>
<div class="preview-wrap">

<!-- (3) 마크업. 데모가 들어갈 자리에 넣으세요. 부모 너비에 맞춰 자동으로 축소됩니다.
     라이트로 쓰려면 data-theme="light" 속성을 추가하면 됩니다. -->
<div class="mcx" data-mcx-monitor role="img"
     aria-label="MCP 모니터 데모: 에이전트가 SAP 시스템과 작업 공간에서 호출하는 도구가 실시간으로 목록에 쌓이고, 호출 수와 응답 시간 지표가 함께 갱신됩니다.">
  <div class="mcx-stage" aria-hidden="true">

    <svg class="mcx-sprite">
      <symbol id="mcx-cal" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></symbol>
      <symbol id="mcx-wave" viewBox="0 0 16 16"><path d="M1.5 8.5h2.6l1.7-5 2.6 9 1.8-5.5 1 1.5h3.3"/></symbol>
      <symbol id="mcx-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3"/><path d="m10.3 10.3 3.2 3.2"/></symbol>
      <symbol id="mcx-chev" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></symbol>
      <symbol id="mcx-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.2 4.5V3h3.6v1.5M4.3 4.5l.6 8.5h6.2l.6-8.5M6.8 7v3.8M9.2 7v3.8"/></symbol>
    </svg>

    <div class="mcx-page">
      <div class="mcx-eyebrow" data-i="eyebrow"></div>
      <h3 class="mcx-title" data-i="title"></h3>
      <p class="mcx-desc" data-i="desc"></p>
      <div class="mcx-rule"></div>

      <div class="mcx-card mcx-stats">
        <div class="mcx-head"><svg class="mcx-i"><use href="#mcx-cal"/></svg><span data-i="week"></span></div>
        <div class="mcx-tiles">
          <div class="mcx-tile">
            <div class="mcx-k" data-i="calls"></div>
            <div class="mcx-big"><span class="mcx-num" data-v="total">0</span><small data-i="unit"></small></div>
            <div class="mcx-split"><i></i></div>
            <div class="mcx-foot" data-i-html="callsFoot"></div>
          </div>
          <div class="mcx-tile">
            <div class="mcx-k" data-i="failDeny"></div>
            <div class="mcx-donut-row">
              <div class="mcx-donut">
                <svg viewBox="0 0 84 84">
                  <circle cx="42" cy="42" r="34" stroke="var(--track)"/>
                  <circle cx="42" cy="42" r="34" stroke="var(--warn)" data-arc="deny"/>
                  <circle cx="42" cy="42" r="34" stroke="var(--bad)" data-arc="fail"/>
                </svg>
                <b data-v="pct">0%</b>
              </div>
              <div class="mcx-legend">
                <i style="background:var(--bad)"></i><span data-i="fail"></span><span data-v="fail">0</span>
                <i style="background:var(--warn)"></i><span data-i="deny"></span><span data-v="deny">0</span>
                <i style="background:var(--track)"></i><span data-i="ok"></span><span data-v="ok">0</span>
              </div>
            </div>
          </div>
          <div class="mcx-tile">
            <div class="mcx-k" data-i="resp"></div>
            <div class="mcx-big"><span class="mcx-num" data-v="med">0.0</span> s</div>
            <div class="mcx-foot" data-i-html="respFoot"></div>
          </div>
          <div class="mcx-tile mcx-tile-top">
            <div class="mcx-k" data-i="most"></div>
            <div class="mcx-bars"></div>
            <div class="mcx-foot" data-i-html="mostFoot"></div>
          </div>
        </div>
      </div>

      <div class="mcx-card mcx-calls">
        <div class="mcx-head"><svg class="mcx-i"><use href="#mcx-wave"/></svg><span data-i="list"></span><span class="mcx-live"><i></i><span data-i="live"></span></span></div>
        <p class="mcx-sub" data-i="sub"></p>
        <div class="mcx-filters">
          <div class="mcx-field mcx-search"><svg class="mcx-i"><use href="#mcx-search"/></svg><span data-i="search"></span></div>
          <div class="mcx-field mcx-select mcx-x"><span data-i="status"></span><svg class="mcx-i"><use href="#mcx-chev"/></svg></div>
          <div class="mcx-field mcx-select mcx-x" style="width:150px"><svg class="mcx-i"><use href="#mcx-cal"/></svg><span data-i="period"></span><svg class="mcx-i"><use href="#mcx-chev"/></svg></div>
          <div class="mcx-field mcx-select mcx-x"><span data-i="sort"></span><svg class="mcx-i"><use href="#mcx-chev"/></svg></div>
          <div class="mcx-space mcx-x"></div>
          <div class="mcx-field mcx-mcp"><i class="mcx-check"></i><span data-i="mcpOnly"></span></div>
          <div class="mcx-field mcx-x"><svg class="mcx-i"><use href="#mcx-trash"/></svg><span data-i="clear"></span></div>
        </div>
        <div class="mcx-list"></div>
      </div>
    </div>

    <div class="mcx-cursor"><svg viewBox="0 0 20 20"><path d="M3 2l13.2 6.4-5.7 1.7-1.9 5.7L3 2z" stroke-width="1" stroke-linejoin="round"/></svg></div>
  </div>
</div>

</div>

<!-- (4) 스크립트. </body> 바로 앞에 넣으세요. 의존성 없고, 페이지 안의 모든 data-mcx-monitor 요소에 적용됩니다. -->
<script>
(function () {
  /* 언어: 사이트가 window.__reelLang 으로 넘겨 주고, 없으면 문서의 lang (기본 ko) */
  var LANG = (function () { var l = String(window.__reelLang || document.documentElement.getAttribute('lang') || 'ko').toLowerCase(); return l.indexOf('ja') === 0 ? 'ja' : l.indexOf('en') === 0 ? 'en' : 'ko'; })();
  document.documentElement.lang = LANG;

  /* ---------- 화면 문구 (언어별) ---------- */
  var TEXT = {
    ko: {
      docTitle: 'MCP 모니터 데모 모션',
      aria: 'MCP 모니터 데모: 에이전트가 SAP 시스템과 작업 공간에서 호출하는 도구가 실시간으로 목록에 쌓이고, 호출 수와 응답 시간 지표가 함께 갱신됩니다.',
      eyebrow: '시스템', title: 'MCP 모니터',
      desc: '에이전트가 대신 호출하는 모든 도구를 실시간으로 봅니다. MCP 호출은 SAP 시스템에 닿는 것이고, 나머지는 에이전트가 자기 작업 공간을 읽는 것입니다.',
      week: '최근 7일', calls: '이번 주 호출', unit: '건',
      callsFoot: 'SAP <span data-v="sap">0</span> · 워크스페이스 <span data-v="ws">0</span><br>최근 24시간 <span data-v="day">0</span>건',
      failDeny: '실패 또는 거부', fail: '실패', deny: '거부', ok: '성공',
      resp: 'SAP 응답 시간',
      respFoot: 'p95 <span data-v="p95">0.0</span> s · MCP 호출 <span data-v="sap2">0</span>건의 중앙값',
      most: '최다 호출',
      mostFoot: '1위 <code data-v="topName"></code> · <span data-v="topN">0</span>건 · SAP 호출의 <span data-v="topPct">0</span>%',
      list: '호출', live: '실시간', sub: '실시간. 에이전트가 호출하는 대로 새 항목이 나타납니다.',
      search: '도구 이름 또는 입력, 예: GetTypeInfo 또는 MARA',
      status: '모든 상태', period: '전체 기간', sort: '최신순', mcpOnly: 'MCP만', clear: '초기화',
      builtin: '내장', spec: '기능/기술 명세서'
    },
    en: {
      docTitle: 'MCP Monitor demo',
      aria: 'MCP Monitor demo: the tools an agent calls on the SAP system and in its workspace stack up in a live list, while call counts and response times update alongside.',
      eyebrow: 'System', title: 'MCP Monitor',
      desc: 'Watch every tool the agent calls on your behalf, live. MCP calls reach the SAP system; the rest are the agent reading its own workspace.',
      week: 'Last 7 days', calls: 'Calls this week', unit: 'calls',
      callsFoot: 'SAP <span data-v="sap">0</span> · Workspace <span data-v="ws">0</span><br>Last 24h: <span data-v="day">0</span>',
      failDeny: 'Failed or denied', fail: 'Failed', deny: 'Denied', ok: 'OK',
      resp: 'SAP response time',
      respFoot: 'p95 <span data-v="p95">0.0</span> s · median of <span data-v="sap2">0</span> MCP calls',
      most: 'Most called',
      mostFoot: '#1 <code data-v="topName"></code> · <span data-v="topN">0</span> · <span data-v="topPct">0</span>% of SAP calls',
      list: 'Calls', live: 'Live', sub: 'Live. New entries appear as the agent makes calls.',
      search: 'Tool name or input, e.g. GetTypeInfo or MARA',
      status: 'All statuses', period: 'All time', sort: 'Newest first', mcpOnly: 'MCP only', clear: 'Clear',
      builtin: 'built-in', spec: 'Functional/Technical Spec'
    },
    ja: {
      docTitle: 'MCPモニター デモ',
      aria: 'MCPモニターのデモ: エージェントがSAPシステムと作業領域で呼び出すツールがリアルタイムに一覧へ積み重なり、呼び出し数と応答時間の指標も一緒に更新されます。',
      eyebrow: 'システム', title: 'MCPモニター',
      desc: 'エージェントが代わりに呼び出すすべてのツールをリアルタイムで確認できます。MCP呼び出しはSAPシステムに届くもの、それ以外はエージェントが自分の作業領域を読むものです。',
      week: '直近7日間', calls: '今週の呼び出し', unit: '件',
      callsFoot: 'SAP <span data-v="sap">0</span> · ワークスペース <span data-v="ws">0</span><br>直近24時間 <span data-v="day">0</span>件',
      failDeny: '失敗または拒否', fail: '失敗', deny: '拒否', ok: '成功',
      resp: 'SAP応答時間',
      respFoot: 'p95 <span data-v="p95">0.0</span> s · MCP呼び出し<span data-v="sap2">0</span>件の中央値',
      most: '最多呼び出し',
      mostFoot: '1位 <code data-v="topName"></code> · <span data-v="topN">0</span>件 · SAP呼び出しの<span data-v="topPct">0</span>%',
      list: '呼び出し', live: 'リアルタイム', sub: 'リアルタイム。エージェントが呼び出すたびに新しい項目が表示されます。',
      search: 'ツール名または入力 例: GetTypeInfo、MARA',
      status: 'すべての状態', period: '全期間', sort: '新しい順', mcpOnly: 'MCPのみ', clear: 'クリア',
      builtin: '内蔵', spec: '機能/技術仕様書'
    }
  };
  var T = TEXT[LANG];

  /* ---------- 여기만 고치면 숫자와 호출 내용이 바뀝니다 ---------- */
  var MCP = 'sc4sap_sap', BUILTIN = T.builtin;   // 호출 출처 이름. MCP 쪽이 SAP 호출로 집계됩니다.
  var CONFIG = {
    // 시작 지표
    stats: { sap: 81, ws: 123, day: 10, fail: 1, deny: 2, med: 2.5, p95: 3.0 },
    // 최다 호출 막대 (1위부터). 1위 도구가 새로 호출되면 막대가 자랍니다.
    top: [19, 19, 17, 16, 3],
    topName: 'GetObjectInfo',
    // 처음부터 목록에 있는 호출. ago: 지금으로부터 몇 초 전인지
    initial: [
      { tool: 'Bash', src: BUILTIN, arg: '{"command":"node scripts/spec/md-to-html.mjs \\".sc4sap/out/ZMMR00020-' + LANG + '.md\\""}', ms: '172 ms', size: '153 B', ago: 41 },
      { tool: 'Edit', src: BUILTIN, arg: '{"replace_all":false,"file_path":".sc4sap/out/ZMMR00020-' + LANG + '.md","old_string":"## 2. Data…', ms: '23 ms', size: '226 B', ago: 45 },
      { tool: 'Write', src: BUILTIN, arg: '{"file_path":".sc4sap/out/ZMMR00020-' + LANG + '.md","content":"# ' + T.spec + ': ZMMR00020…', ms: '29 ms', size: '216 B', ago: 49 },
      { tool: 'Bash', src: BUILTIN, arg: '{"command":"node scripts/spec/render-md-images.mjs \\".sc4sap/out/_img\\""}', ms: '3.0 s', size: '694 B', ago: 100 },
      { tool: 'Write', src: BUILTIN, arg: '{"file_path":".sc4sap/out/_img/image-spec.json","content":"{\\n \\"lang\\": \\"' + LANG + '\\"…', ms: '30 ms', size: '212 B', ago: 104 },
      { tool: 'GetTextElement', src: MCP, arg: '{"program_name":"ZMMR00020"}', ms: '3.2 s', size: '2 KB', ago: 121 }
    ],
    // 실시간으로 들어오는 호출 (위에서부터 순서대로 도착)
    incoming: [
      { tool: 'GetObjectInfo', src: MCP, arg: '{"object_name":"ZMMR00030","object_type":"PROG"}', ms: '2.4 s', size: '1 KB' },
      { tool: 'GetTextElement', src: MCP, arg: '{"program_name":"ZMMR00030"}', ms: '3.1 s', size: '2 KB' },
      { tool: 'GetScreensList', src: MCP, arg: '{"program_name":"ZMMR00030"}', ms: '2.2 s', size: '418 B' },
      { tool: 'GetTypeInfo', src: MCP, arg: '{"type_name":"ZMMT00130"}', ms: '2.6 s', size: '3 KB' },
      { tool: 'Write', src: BUILTIN, arg: '{"file_path":".sc4sap/out/ZMMR00030-' + LANG + '.md","content":"# ' + T.spec + ': ZMMR00030…', ms: '31 ms', size: '208 B' }
    ],
    gapMs: 1150,                              // 호출이 도착하는 간격
    holdMs: 1500                              // 마지막 화면 유지 시간
  };
  /* ------------------------------------------------------------- */

  if (LANG !== 'ko') document.title = T.docTitle;

  var CANCEL = {}, C = 2 * Math.PI * 34;

  /* ---------- 재생 중 언어 바꾸기 ----------
     window.__reelSetLang('en') 처럼 부르면 애니메이션을 되감지 않고 문구만 그 자리에서 바뀝니다.
     호출 기록의 출처 이름과 인자 속 언어 표시(-ko.md, "lang", 명세서 제목)도 함께 바꿔서,
     이미 목록에 있는 줄과 앞으로 들어올 줄이 같은 언어가 되도록 합니다. */
  var relang = [];
  function swapArg(a, o, n, oT, nT) {
    return a.split('-' + o + '.md').join('-' + n + '.md')
            .split('\\"lang\\": \\"' + o).join('\\"lang\\": \\"' + n)
            .split(oT.spec).join(nT.spec);
  }
  window.__reelSetLang = function (l) {
    l = String(l || '').toLowerCase();
    var n = l.indexOf('ja') === 0 ? 'ja' : l.indexOf('en') === 0 ? 'en' : 'ko';
    if (n === LANG) return;
    var o = LANG, oT = T, nT = TEXT[n];
    LANG = n; T = nT; BUILTIN = nT.builtin;
    document.documentElement.lang = n;
    document.title = n === 'ko' ? TEXT.ko.docTitle : nT.docTitle;
    CONFIG.initial.concat(CONFIG.incoming).forEach(function (c) {
      if (c.src !== MCP) c.src = BUILTIN;
      c.arg = swapArg(c.arg, o, n, oT, nT);
    });
    relang.forEach(function (f) { f(o, n, oT, nT); });
  };

  function init(root) {
    var $ = function (s) { return root.querySelector(s); };
    var all = function (s) { return [].slice.call(root.querySelectorAll(s)); };
    var stage = $('.mcx-stage'), page = $('.mcx-page'), cursor = $('.mcx-cursor'),
        list = $('.mcx-list'), bars = $('.mcx-bars'), split = $('.mcx-split i'),
        statsCard = $('.mcx-stats'), mcpBtn = $('.mcx-mcp'),
        arcFail = $('[data-arc="fail"]'), arcDeny = $('[data-arc="deny"]');
    // 문구 채우기 (data-v 를 담은 문구가 있어서 out 을 모으기 전에)
    root.setAttribute('aria-label', T.aria);
    all('[data-i]').forEach(function (el) { el.textContent = T[el.getAttribute('data-i')]; });
    all('[data-i-html]').forEach(function (el) { el.innerHTML = T[el.getAttribute('data-i-html')]; });
    var out = {};
    all('[data-v]').forEach(function (el) { out[el.getAttribute('data-v')] = el; });
    var scale = 1, token = 0, running = false, compact = null, st, top;

    /* 언어 교체. data-i-html 문구에는 살아 있는 숫자 칸(data-v)이 들어 있어서,
       새 문구를 만든 뒤 그 안의 빈 칸 자리에 기존 숫자 칸을 그대로 옮겨 끼웁니다. */
    relang.push(function (o, n, oT, nT) {
      root.setAttribute('aria-label', nT.aria);
      all('[data-i]').forEach(function (el) { el.textContent = nT[el.getAttribute('data-i')]; });
      all('[data-i-html]').forEach(function (el) {
        var tmp = document.createElement('div');
        tmp.innerHTML = nT[el.getAttribute('data-i-html')];
        [].forEach.call(tmp.querySelectorAll('[data-v]'), function (slot) {
          var live = out[slot.getAttribute('data-v')];
          if (live) slot.parentNode.replaceChild(live, slot);
        });
        while (el.firstChild) el.removeChild(el.firstChild);
        while (tmp.firstChild) el.appendChild(tmp.firstChild);
      });
      all('.mcx-row').forEach(function (r) {
        var src = r.querySelector('.mcx-tool small'), arg = r.querySelector('.mcx-arg');
        if (src && r.getAttribute('data-src') === 'builtin') src.textContent = nT.builtin;
        if (arg) arg.textContent = swapArg(arg.textContent, o, n, oT, nT);
      });
    });

    bars.innerHTML = CONFIG.top.map(function (_, i) { return '<div><span></span><i></i><span>' + (i + 1) + '</span></div>'; }).join('');
    var barEls = [].slice.call(bars.children);
    out.topName.textContent = CONFIG.topName;

    function sleep(ms, t) {
      return new Promise(function (res, rej) {
        setTimeout(function () { t === token ? res() : rej(CANCEL); }, ms);
      });
    }
    function fit() {
      var w = root.clientWidth;
      if (!w) return;
      var c = w < 640;
      root.classList.toggle('is-compact', c);
      scale = w / (c ? 480 : 1200);
      root.style.setProperty('--s', scale);
      root.classList.add('is-ready');
      if (compact !== null && compact !== c && running) { compact = c; stop(); start(); }
      compact = c;
    }

    /* 지표 그리기. k는 0→1 (등장할 때 숫자가 차오르는 정도) */
    function render(k) {
      var sap = Math.round(st.sap * k), ws = Math.round(st.ws * k), total = sap + ws;
      var fail = Math.round(st.fail * k), deny = Math.round(st.deny * k);
      out.total.textContent = total;
      out.sap.textContent = sap; out.sap2.textContent = sap; out.ws.textContent = ws;
      out.day.textContent = Math.round(st.day * k);
      split.style.setProperty('--w', (total ? sap / total * 100 : 0) + '%');
      out.fail.textContent = fail; out.deny.textContent = deny; out.ok.textContent = total - fail - deny;
      out.pct.textContent = (total ? (fail + deny) / total * 100 : 0).toFixed(1) + '%';
      // 도넛: 아주 작은 조각도 보이도록 최소 길이를 줍니다
      var fl = Math.max(3, st.fail / (st.sap + st.ws) * C) * k, dl = Math.max(4, st.deny / (st.sap + st.ws) * C) * k;
      arcFail.setAttribute('stroke-dasharray', fl + ' ' + C);
      arcDeny.setAttribute('stroke-dasharray', dl + ' ' + C);
      arcDeny.setAttribute('stroke-dashoffset', -fl);
      out.med.textContent = (st.med * k).toFixed(1); out.p95.textContent = (st.p95 * k).toFixed(1);
      var max = Math.max.apply(null, top), barH = compact ? 40 : 48;
      barEls.forEach(function (el, i) {
        el.firstChild.textContent = Math.round(top[i] * k);
        el.children[1].style.setProperty('--h', top[i] / max * barH * k + 'px');
      });
      out.topN.textContent = Math.round(top[0] * k);
      out.topPct.textContent = sap ? Math.round(top[0] * k / sap * 100) : 0;
    }
    function bump(el) { el.classList.remove('is-bump'); void el.offsetWidth; el.classList.add('is-bump'); }

    function stamp(d) {
      var p = function (n) { return ('0' + n).slice(-2); };
      return '<span class="mcx-date">' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' </span>' +
             p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    function makeRow(c, when) {
      var el = document.createElement('div');
      el.className = 'mcx-row';
      el.setAttribute('data-src', c.src === MCP ? 'mcp' : 'builtin');
      el.innerHTML = '<i class="mcx-dot"></i><span class="mcx-time">' + stamp(when) + '</span>' +
        '<span class="mcx-tool">' + esc(c.tool) + '<small>' + esc(c.src) + '</small></span>' +
        '<span class="mcx-arg mcx-x">' + esc(c.arg) + '</span>' +
        '<span class="mcx-ms">' + c.ms + '</span><span class="mcx-ms mcx-x">' + c.size + '</span>';
      return el;
    }
    /* 새 호출 한 건: 목록 맨 위에 끼워 넣고 지표를 갱신 */
    function arrive(c) {
      var el = makeRow(c, new Date());
      el.classList.add('is-out');
      list.insertBefore(el, list.firstChild);
      void el.offsetWidth;
      el.classList.remove('is-out'); el.classList.add('is-new');
      if (c.src === MCP) st.sap++; else st.ws++;
      st.day++;
      if (c.tool === CONFIG.topName) top[0]++;
      render(1); bump(out.total);
    }

    function topIn(el, box) { return (el.getBoundingClientRect().top - box.getBoundingClientRect().top) / scale; }
    function scrollPage(el, gap) {
      var max = Math.max(0, page.offsetHeight - (compact ? 700 : 640));
      var y = Math.min(max, Math.max(0, topIn(el, page) - gap));
      page.style.transform = 'translateY(' + -y + 'px)';
    }
    function point(el, fx, fy) {
      var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
      return [(r.left - s.left + r.width * fx) / scale, (r.top - s.top + r.height * fy) / scale];
    }
    function moveTo(p) { cursor.style.transform = 'translate(' + (p[0] - 3) + 'px,' + (p[1] - 2) + 'px)'; }
    function setFilter(on) {
      root.classList.toggle('is-mcp-only', on);
      all('.mcx-row[data-src="builtin"]').forEach(function (r) { r.classList.toggle('is-out', on); });
    }

    function reset() {
      root.classList.add('is-resetting');
      root.classList.remove('is-mcp-only', 'is-fading');
      st = JSON.parse(JSON.stringify(CONFIG.stats)); top = CONFIG.top.slice();
      list.innerHTML = '';
      var now = Date.now();
      CONFIG.initial.forEach(function (c) { list.appendChild(makeRow(c, new Date(now - c.ago * 1000))); });
      render(0);
      page.style.transform = 'none';
      cursor.classList.remove('is-on', 'is-click'); mcpBtn.classList.remove('is-press');
      void root.offsetWidth;
      root.classList.remove('is-resetting');
    }

    /* 모션을 끈 사용자에게 보여줄 완성 화면 */
    function renderFinal() {
      reset();
      CONFIG.incoming.forEach(arrive);
      all('.mcx-row').forEach(function (r) { r.classList.remove('is-new'); });
      scrollPage(statsCard, 14);
    }

    function countUp(ms, t) {
      return new Promise(function (res, rej) {
        var t0 = performance.now();
        (function f(now) {
          if (t !== token) return rej(CANCEL);
          var p = Math.min(1, (now - t0) / ms);
          render(1 - Math.pow(1 - p, 3));
          p < 1 ? requestAnimationFrame(f) : res();
        })(t0);
      });
    }

    async function play(t) {
      try {
        for (;;) {
          reset();
          await sleep(500, t);

          // 1. 지표가 차오른다
          await countUp(1300, t);
          await sleep(900, t);

          // 2. 목록이 잘 보이도록 내려간 뒤, 호출이 실시간으로 도착
          scrollPage(statsCard, 14);
          await sleep(1200, t);
          for (var i = 0; i < CONFIG.incoming.length; i++) {
            arrive(CONFIG.incoming[i]);
            await sleep(CONFIG.gapMs, t);
          }
          await sleep(500, t);

          // 3. "MCP만"을 눌러 SAP에 닿은 호출만 남긴다
          moveTo(point(stage, .7, .92)); void cursor.offsetWidth;
          cursor.classList.add('is-on');
          moveTo(point(mcpBtn, .5, .6));
          await sleep(850, t);
          cursor.classList.remove('is-click'); void cursor.offsetWidth; cursor.classList.add('is-click');
          mcpBtn.classList.add('is-press');
          await sleep(150, t);
          mcpBtn.classList.remove('is-press');
          setFilter(true);
          await sleep(900, t);
          cursor.classList.remove('is-on');
          await sleep(CONFIG.holdMs, t);

          root.classList.add('is-fading');
          await sleep(520, t);
        }
      } catch (e) { if (e !== CANCEL) throw e; }
    }

    function start() { if (running) return; running = true; play(++token); }
    function stop() { if (!running) return; running = false; token++; reset(); }

    st = JSON.parse(JSON.stringify(CONFIG.stats)); top = CONFIG.top.slice();
    fit();
    if ('ResizeObserver' in window) new ResizeObserver(fit).observe(root);
    else window.addEventListener('resize', fit);

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { renderFinal(); return; }

    reset();
    // 화면에 보일 때만 재생
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) {
        en[0].isIntersecting ? start() : stop();
      }, { threshold: .25 }).observe(root);
    } else { start(); }
  }

  [].forEach.call(document.querySelectorAll('[data-mcx-monitor]'), init);
})();
</script>
</body>
